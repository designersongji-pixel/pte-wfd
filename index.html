<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTE WFD 연습</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3b5bfd">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PTE WFD">
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#151b2c; --sub:#6b7280; --line:#e5e8ef;
    --accent:#3b5bfd; --accent-soft:#eef1ff; --ok:#0f9d58; --ok-soft:#e6f6ee;
    --bad:#e5484d; --bad-soft:#fdecec; --warn:#b7791f; --warn-soft:#fdf3e0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  header h1{font-size:18px;font-weight:800;letter-spacing:-.3px}
  header h1 span{color:var(--accent)}
  select,button,input{font-family:inherit;font-size:14px}
  select,input[type=number],input[type=text]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .tabs{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
  .tab{padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--sub);font-size:13.5px}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  main{max-width:880px;margin:0 auto;padding:20px 16px 60px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:14px;color:var(--sub)}
  .bar label{display:flex;align-items:center;gap:6px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px}
  .chip b{color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 1px 3px rgba(20,30,60,.05)}
  .qnum{font-size:13px;color:var(--sub);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .audiorow{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .playbtn{width:52px;height:52px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:21px;cursor:pointer;flex-shrink:0;transition:transform .1s}
  .playbtn:active{transform:scale(.93)}
  .playbtn.small{width:34px;height:34px;font-size:13px}
  .speed{display:flex;gap:4px}
  .speed button{padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12px;color:var(--sub)}
  .speed button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  textarea{width:100%;min-height:90px;padding:14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;resize:vertical;outline:none}
  textarea:focus{border-color:var(--accent)}
  .btnrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
  .btn{padding:11px 20px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:15px}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn.good{background:var(--ok);color:#fff}
  .btn.badb{background:var(--bad);color:#fff}
  .btn.sm{padding:7px 13px;font-size:13px}
  .result{margin-top:20px;padding-top:18px;border-top:1px dashed var(--line)}
  .score{font-size:15px;font-weight:800;margin-bottom:10px}
  .score.allok{color:var(--ok)} .score.miss{color:var(--bad)}
  .diff{line-height:2;font-size:17px}
  .w-ok{color:var(--ok)}
  .w-miss{color:var(--bad);text-decoration:underline;font-weight:700}
  .w-extra{color:var(--warn);text-decoration:line-through}
  .ko{margin-top:12px;color:var(--sub);font-size:15px}
  .vocab{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
  .vw{background:var(--accent-soft);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
  .vw b{color:var(--accent)}
  .vw i{color:var(--sub);font-style:normal;font-size:11px}
  .flash{cursor:pointer;user-select:none;min-height:200px;display:flex;flex-direction:column;justify-content:center}
  .flash .en{font-size:22px;font-weight:700;line-height:1.55;letter-spacing:-.2px}
  .flash .hint{margin-top:18px;font-size:13px;color:var(--sub)}
  .empty{text-align:center;color:var(--sub);padding:50px 0;font-size:15px}
  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
  .stat .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat .box .v{font-size:20px;font-weight:800;color:var(--accent)}
  .stat .box .l{font-size:11.5px;color:var(--sub);margin-top:2px}
  .prog{height:6px;background:var(--line);border-radius:3px;margin-bottom:16px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
  kbd{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px;font-family:inherit}
  .foot{margin-top:14px;font-size:12.5px;color:var(--sub)}
  .report{background:none;border:none;color:var(--sub);font-size:12px;cursor:pointer;text-decoration:underline;padding:2px 4px}
  .report:hover{color:var(--bad)}
  .wclick{cursor:pointer;border-bottom:1.5px dotted transparent;border-radius:3px;transition:background .12s}
  .wclick:hover{background:var(--accent-soft);border-bottom-color:var(--accent)}
  #wpop{position:fixed;z-index:99;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(20,30,60,.18);padding:14px 16px;max-width:300px;display:none}
  #wpop .ww{font-size:18px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #wpop .wipa{font-size:13px;color:var(--sub);font-weight:400}
  #wpop .ws{width:30px;height:30px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:13px;flex-shrink:0}
  #wpop .wm{margin-top:6px;font-size:14px;line-height:1.5}
  #wpop .wp{color:var(--sub);font-size:11.5px;margin-top:2px}
  #wpop .wx{position:absolute;top:8px;right:10px;border:none;background:none;color:var(--sub);cursor:pointer;font-size:14px}
  #wpop .wsave{margin-top:10px;width:100%;padding:8px;border-radius:8px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;cursor:pointer;font-size:13px}
  #wpop .wsave.saved{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  /* 플랜 */
  .plan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
  .plan .ptitle{font-weight:800;color:var(--accent)}
  .plan input{width:64px;text-align:center}
  .plan .pinfo{color:var(--sub);font-size:13px}
  .plan .preset{padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;color:var(--sub)}
  .plan .preset.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .planbadge{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:700}
  /* 전체보기 */
  .browse-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
  .browse-item .bi-top{display:flex;gap:10px;align-items:flex-start}
  .browse-item .bi-num{font-size:12px;color:var(--sub);font-weight:700;padding-top:8px;min-width:38px}
  .browse-item .bi-en{font-size:15.5px;font-weight:600;line-height:1.6;flex:1;padding-top:5px}
  .browse-item .bi-ko{font-size:13.5px;color:var(--sub);margin-top:6px;padding-left:48px}
  .browse-item .bi-badge{font-size:11px;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle}
  .b-wrong{background:var(--bad-soft);color:var(--bad)}
  .b-done{background:var(--ok-soft);color:var(--ok)}
  /* 단어장 */
  .word-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
  .word-item .wi-word{font-weight:800;font-size:16px;color:var(--accent);min-width:120px;cursor:pointer}
  .word-item .wi-ipa{color:var(--sub);font-size:12px;min-width:70px}
  .word-item .wi-mean{flex:1;font-size:14px}
  .word-item .wi-mean.hidden{filter:blur(6px);cursor:pointer}
  .word-item .wi-del{border:none;background:none;color:var(--sub);cursor:pointer;font-size:15px}
  .word-item .wi-stat{font-size:11px;color:var(--sub);min-width:52px;text-align:right}
  .daygroup{margin:18px 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .daygroup h3{font-size:14.5px;font-weight:800}
  .daygroup .dcount{font-size:12px;color:var(--sub)}
  /* 단어 시험 */
  .quizcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 26px;text-align:center}
  .quizcard .qmean{font-size:22px;font-weight:800;margin-bottom:6px}
  .quizcard .qpos{font-size:12.5px;color:var(--sub);margin-bottom:18px}
  .quizcard input[type=text]{width:100%;max-width:420px;font-size:22px;padding:12px 14px;text-align:center;letter-spacing:.5px;border:1.5px solid var(--line);border-radius:12px;outline:none}
  .quizcard input:focus{border-color:var(--accent)}
  .qfeed{margin-top:16px;font-size:26px;letter-spacing:2px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .qfeed .c-ok{color:var(--ok)}
  .qfeed .c-bad{color:var(--bad);text-decoration:underline;text-underline-offset:4px}
  .qfeed .c-miss{color:var(--bad);opacity:.45}
  .qanswer{margin-top:10px;font-size:15px;color:var(--sub)}
  .qanswer b{color:var(--ink);font-size:19px}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:10px;font-size:13.5px;display:none;z-index:100}
  /* 검색 */
  .searchwrap{position:relative;flex:1;min-width:180px;max-width:340px}
  #gSearch{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none}
  #gSearch:focus{border-color:var(--accent);background:#fff}
  .searchwrap .sicon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:13px;pointer-events:none}
  #sResults{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 34px rgba(20,30,60,.16);max-height:70vh;overflow-y:auto;display:none;z-index:40;min-width:340px}
  #sResults .sgroup{font-size:11px;font-weight:800;color:var(--sub);padding:9px 14px 5px;letter-spacing:.3px;background:var(--bg);position:sticky;top:0}
  #sResults .sitem{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
  #sResults .sitem:hover,#sResults .sitem.sel{background:var(--accent-soft)}
  #sResults .sitem .s-en{font-size:13.5px;font-weight:600;line-height:1.45}
  #sResults .sitem .s-ko{font-size:12px;color:var(--sub);margin-top:2px}
  #sResults .sitem .s-n{color:var(--accent);font-weight:800;font-size:11.5px;margin-right:5px}
  #sResults .sitem mark{background:#fff2a8;color:inherit;border-radius:3px;padding:0 1px}
  #sResults .sempty{padding:18px 14px;color:var(--sub);font-size:13px;text-align:center}
  @media(max-width:640px){ #sResults{min-width:unset;position:fixed;left:8px;right:8px;top:64px} }
  @media(max-width:640px){ .tabs{margin-left:0;width:100%} .card{padding:18px} .browse-item .bi-ko{padding-left:0} }

  /* 서브탭 (WFD 내부) */
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .subtabs .tab{font-size:12.5px;padding:6px 12px;background:var(--bg)}
  .subtabs .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* PTE 템플릿 */
  .structSel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .goalBadge{background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700}
  .stepbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .step{flex:1;min-width:64px;text-align:center;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;font-size:11px;color:var(--sub);cursor:pointer}
  .step .si{font-size:17px;display:block;margin-bottom:2px}
  .step.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:800}
  .step.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .tplTarget{font-size:17px;line-height:1.7;padding:16px;background:var(--bg);border-radius:12px;margin-bottom:14px;white-space:pre-wrap}
  .tplTarget .fillmark{color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 3px;font-weight:700}
  .tplTarget .we-var{color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:0 3px;font-weight:700}
  .blankWrap{display:inline-block}
  .blankInput{border:none;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:4px 4px 0 0;padding:1px 5px;font:inherit;font-size:16px;color:var(--ink);text-align:center;outline:none}
  .blankInput:focus{background:#fff;box-shadow:0 0 0 2px var(--accent-soft)}
  .blankInput.ok{border-bottom-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
  .blankInput.bad{border-bottom-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
  .colorLegend{font-size:12px;color:var(--sub);margin:-6px 0 12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .colorLegend .lg{display:inline-flex;align-items:center;gap:5px}
  .colorLegend .sw{width:12px;height:12px;border-radius:3px;display:inline-block}

  /* WE (Write Essay) 전용 */
  .weTop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .weTop h2{font-size:18px;font-weight:800}
  .weBadge{border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700}
  .weBadge.words{background:var(--accent-soft);color:var(--accent)}
  .weBadge.time{background:var(--warn-soft);color:var(--warn)}
  .weTimeDetail{font-size:12.5px;color:var(--sub)}
  .wePrincipleBanner{background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;font-weight:800;font-size:14.5px;margin-bottom:16px;text-align:center}
  .weInputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:16px}
  .weField label{display:block;font-size:12px;font-weight:800;color:var(--accent);margin-bottom:4px}
  .weField input{width:100%}
  .weFallbackBtn{margin-top:6px;width:100%;font-size:11.5px;padding:6px 8px;white-space:normal;text-align:center;line-height:1.3}
  .weSection{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:var(--card)}
  .weSection .wsTitle{font-size:13px;font-weight:800;color:var(--sub);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .weSection .wsHint{font-weight:500;font-size:11.5px;color:var(--sub)}
  .weSentLine{display:flex;gap:10px;padding:4px 0;font-size:16px;line-height:1.6}
  .weSentLine .wsNum{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--bg);color:var(--sub);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:3px}
  .weSection.special{background:var(--warn-soft);border-color:var(--warn);border-style:dashed}
  .weSection.special .wsTitle{color:var(--warn)}
  .weSection.special.empty .weSentLine{color:var(--sub);font-style:italic}
  .wordCount{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
  .wcBadge{border-radius:10px;padding:8px 14px;font-weight:800;font-size:14.5px}
  .wcBadge.short{background:var(--bad-soft);color:var(--bad)}
  .wcBadge.valid{background:var(--ok-soft);color:var(--ok)}
  .wcBadge.long{background:var(--bad-soft);color:var(--bad)}
  .wcRec{font-size:12.5px;color:var(--sub)}
  .weSpecialCtrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .weSpecialCtrl select{min-width:220px}
  .weSpecialNote{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px;margin-top:6px}
  .weGuideTable{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  .weGuideTable th,.weGuideTable td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  .weGuideTable th{background:var(--bg);font-size:12px;color:var(--sub)}
  .weEditBar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .weEditLine{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
  .weEditLine .wsNum{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--bg);color:var(--sub);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:6px}
  .weEditLine input{flex:1}
  .weEditLine input.tokenmissing{border-color:var(--bad);background:var(--bad-soft)}
  .weTokenWarn{font-size:12px;color:var(--bad);margin-top:4px}
  .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px;margin-right:8px}
  .sectionhead{font-size:12.5px;font-weight:800;color:var(--sub);margin:16px 0 6px;padding-top:10px;border-top:1px dashed var(--line)}
  .sectionhead:first-child{margin-top:0;border-top:none;padding-top:0}
  .tipbox{background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin-top:18px;font-size:13.5px;color:var(--ink)}
  .tipbox b{color:var(--accent)}
  .tipbox ul{margin:6px 0 0 18px}
  .tipbox li{margin-bottom:3px}
  .timerBig{font-size:34px;font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;color:var(--accent)}
  .phaserow{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
  .phasechip{flex:1;min-width:100px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--sub)}
  .phasechip.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:800}
  .phasechip.past{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .checklist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
  .checkitem{display:flex;align-items:center;gap:8px;font-size:14px;padding:8px 12px;border-radius:9px;background:var(--bg)}
  .checkitem.pass{background:var(--ok-soft);color:var(--ok)}
  .checkitem.fail{background:var(--bad-soft);color:var(--bad)}
  .critgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  @media(max-width:640px){ .critgrid{grid-template-columns:1fr} }
  .critcol{border-radius:12px;padding:12px 14px;font-size:13px}
  .critcol.good{background:var(--ok-soft)}
  .critcol.bad{background:var(--bad-soft)}
  .critcol h4{margin-bottom:6px;font-size:13px}
  .critcol ul{margin-left:16px}
  .critcol li{margin-bottom:3px}
  .vtable{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  .vtable th,.vtable td{border:1px solid var(--line);padding:6px 9px;text-align:left}
  .vtable th{background:var(--bg);font-size:12px}
  /* 토픽뱅크 */
  .bankform{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .bankform .row2{display:flex;gap:8px;flex-wrap:wrap}
  .bankform .row2>*{flex:1;min-width:140px}
  .bankcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--card)}
  .bankcard .bc-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .bankcard .bc-en{font-size:15.5px;line-height:1.6;font-weight:600}
  .bankcard .bc-ko{font-size:13px;color:var(--sub);margin-top:5px}
  .bankcard .bc-note{font-size:11.5px;color:var(--sub);margin-top:5px}
  .bankcard .bc-actions{display:flex;gap:6px;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>PTE <span>WFD</span> 연습</h1>
  <select id="weekSel"></select>
  <label style="display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--sub)" title="읽어주기(TTS) 목소리 선택 — 목소리 품질/종류는 브라우저·기기에 따라 달라요">🔊<select id="voiceSel" style="max-width:150px"><option>목소리 불러오는 중…</option></select></label>
  <div class="searchwrap">
    <span class="sicon">🔍</span>
    <input type="text" id="gSearch" placeholder="문장·단어·번호 검색 (Ctrl+K)" autocomplete="off">
    <div id="sResults"></div>
  </div>
  <nav class="tabs" id="topTabs">
    <button class="tab on" data-top="wfd">WFD</button>
    <button class="tab" data-top="tpl">PTE 템플릿</button>
    <button class="tab" data-top="bank">토픽뱅크</button>
    <button class="tab" data-top="swt">SWT 체크</button>
    <button class="tab" data-top="words">내 단어장</button>
    <button class="tab" data-top="wordquiz">단어 시험</button>
  </nav>
</header>
<main>
  <nav class="subtabs" id="wfdSub">
    <button class="tab on" data-mode="wfd">받아쓰기</button>
    <button class="tab" data-mode="flash">학습카드</button>
    <button class="tab" data-mode="review">오답복습</button>
    <button class="tab" data-mode="browse">전체보기</button>
  </nav>
  <div class="plan" id="planBox"></div>
  <div class="stat" id="statBoxes"></div>
  <div class="bar" id="ctrlBar">
    <label>범위 <select id="rangeSel"></select></label>
    <label>순서 <select id="orderSel"><option value="seq">번호순</option><option value="rand">랜덤</option></select></label>
    <label><input type="checkbox" id="autoPlay" checked> 자동재생</label>
    <span class="chip" id="posChip"></span>
  </div>
  <div class="prog" id="progWrap"><i id="progBar"></i></div>
  <div id="stage"></div>
  <p class="foot" id="footTip">단축키: <kbd>Enter</kbd> 제출 → 한 번 더 <kbd>Enter</kbd> 다음 · <kbd>←</kbd><kbd>→</kbd> 이전/다음 문제 · <kbd>Ctrl</kbd>+<kbd>K</kbd> 검색 · 단어 클릭 = 뜻/발음 · 문제 오류는 "오류 신고"로</p>
</main>
<div id="toast"></div>
<script src="data.js"></script>
<script src="words.js"></script>
<script src="templates.js"></script>
<script>
(function(){
  const D = window.WFD_DATA;
  if(!D || !D.weeks){ document.getElementById('stage').innerHTML='<div class="card empty">data.js를 찾을 수 없습니다.</div>'; return; }

  // ---------- 상태/저장 ----------
  const LS='wfd_stats_v2', LSW='wfd_words_v2', LSP='wfd_plan_v1', LSI='wfd_ipa_v1';
  localStorage.removeItem('wfd_words_v1');   // 예전 단어장 초기화
  let stats = JSON.parse(localStorage.getItem(LS)||'{}');
  let savedWords = JSON.parse(localStorage.getItem(LSW)||'{}');
  // 기본 제공 단어 시드 반영 (한 번만)
  (function seedWords(){
    const SEEDED='wfd_seeded_v2';
    if(!window.WFD_SEED_WORDS || localStorage.getItem(SEEDED)) return;
    Object.entries(window.WFD_SEED_WORDS).forEach(([date,g])=>{
      const t=new Date(date+'T09:00:00').getTime();
      g.words.forEach((x,i)=>{
        const k=x.w.toLowerCase();
        if(!savedWords[k]) savedWords[k]={w:x.w,m:x.m,p:x.p,at:t+i,src:g.label,r:0,wrong:0};
      });
    });
    localStorage.setItem(LSW,JSON.stringify(savedWords));
    localStorage.setItem(SEEDED,'1');
  })();
  let plan = JSON.parse(localStorage.getItem(LSP)||'null'); // {perDay, startDate}
  let ipaCache = JSON.parse(localStorage.getItem(LSI)||'{}');
  let week = localStorage.getItem('wfd_week') || D.latest;
  if(!D.weeks[week]) week = D.latest;
  let mode='wfd', pool=[], idx=0, revealed=false, audio=null, speed=1.0;
  let session={done:0,ok:0};
  let lastAutoKey='';

  const $=s=>document.querySelector(s);
  const norm=w=>w.toLowerCase().replace(/[^a-z0-9']/g,'');
  const keyOf=s=>{
    const t=s.en.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
    let h=0; for(let i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))>>>0;}
    return 'k'+h.toString(36);
  };
  const sentences=()=>D.weeks[week].sentences;
  const isWrongItem=s=>{const st=stats[keyOf(s)]; return st && st.w>0 && st.streak<2;};
  const isDone=s=>{const st=stats[keyOf(s)]; return st && st.streak>=2;};
  const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._tm); t._tm=setTimeout(()=>t.style.display='none',2200); }

  // ---------- 주차/범위 ----------
  function buildWeekSel(){
    const ws=Object.keys(D.weeks).sort().reverse();
    $('#weekSel').innerHTML=ws.map(w=>{
      const t=D.weeks[w].title.match(/\d+년\s*\d+주차/);
      return `<option value="${w}" ${w===week?'selected':''}>${t?t[0]:w} (${D.weeks[w].sentences.length}문제)</option>`;
    }).join('');
  }
  function todayRange(){
    if(!plan) return null;
    const n=sentences().length;
    const day=Math.floor((Date.now()-new Date(plan.startDate+'T00:00:00'))/86400000);
    const a=day*plan.perDay+1;
    if(a>n) return {a:null,day:day+1,done:true};
    return {a, b:Math.min(a+plan.perDay-1,n), day:day+1, done:false};
  }
  function buildRangeSel(){
    const n=sentences().length, opts=[];
    const tr=todayRange();
    if(tr && !tr.done) opts.push(`<option value="today">📅 오늘 학습 (Day ${tr.day}: #${tr.a}–#${tr.b})</option>`);
    opts.push('<option value="all">전체</option>');
    for(let a=1;a<=n;a+=50) opts.push(`<option value="${a}-${Math.min(a+49,n)}">${a}–${Math.min(a+49,n)}</option>`);
    $('#rangeSel').innerHTML=opts.join('');
  }

  // ---------- 학습 플랜 ----------
  function renderPlan(){
    const n=sentences().length;
    const box=$('#planBox');
    if(!plan){
      box.innerHTML=`<span class="ptitle">📅 학습 플랜</span>
        <button class="preset" data-d="14">2주 완성 (하루 ${Math.ceil(n/14)}개)</button>
        <button class="preset" data-d="30">1달 완성 (하루 ${Math.ceil(n/30)}개)</button>
        <label>직접: 하루 <input type="number" id="perDayIn" min="1" max="${n}" value="7">개</label>
        <span class="pinfo" id="planCalc">→ 약 ${Math.ceil(n/7)}일 걸려요</span>
        <button class="btn primary sm" id="planStart">시작</button>`;
      const updateCalc=()=>{ const v=Math.max(1,parseInt($('#perDayIn').value)||1); $('#planCalc').textContent=`→ 약 ${Math.ceil(n/v)}일 걸려요`; };
      $('#perDayIn').oninput=updateCalc;
      box.querySelectorAll('.preset').forEach(b=>{ b.onclick=()=>{ $('#perDayIn').value=Math.ceil(n/parseInt(b.dataset.d)); updateCalc(); }; });
      $('#planStart').onclick=()=>{
        const v=Math.max(1,parseInt($('#perDayIn').value)||1);
        plan={perDay:v,startDate:new Date().toISOString().slice(0,10)};
        save(LSP,plan); buildRangeSel(); renderPlan();
        toast(`플랜 시작! 하루 ${v}개 × 약 ${Math.ceil(n/v)}일`);
      };
    } else {
      const tr=todayRange();
      const daysTotal=Math.ceil(n/plan.perDay);
      let prog='';
      if(tr.done) prog=`<span class="planbadge">🎉 플랜 완주! (${daysTotal}일 과정)</span>`;
      else{
        const todayList=sentences().filter(s=>s.n>=tr.a&&s.n<=tr.b);
        const doneCnt=todayList.filter(isDone).length;
        prog=`<span class="planbadge">Day ${tr.day}/${daysTotal} · 오늘 #${tr.a}–#${tr.b} (${doneCnt}/${todayList.length} 완료)</span>`;
      }
      box.innerHTML=`<span class="ptitle">📅 하루 ${plan.perDay}개 플랜</span> ${prog}
        <button class="preset" id="goToday">오늘 범위로 연습</button>
        <button class="preset" id="planReset">플랜 변경</button>`;
      $('#goToday').onclick=()=>{ if(!tr.done){ $('#rangeSel').value='today'; buildPool(); render(); } };
      $('#planReset').onclick=()=>{ plan=null; localStorage.removeItem(LSP); buildRangeSel(); renderPlan(); };
    }
  }

  // ---------- 풀 구성 ----------
  function buildPool(){
    let list=sentences().slice();
    if(mode==='review') list=list.filter(isWrongItem);
    const r=$('#rangeSel').value;
    if(r==='today'){ const tr=todayRange(); if(tr&&!tr.done) list=list.filter(s=>s.n>=tr.a&&s.n<=tr.b); }
    else if(r&&r!=='all'){const[a,b]=r.split('-').map(Number); list=list.filter(s=>s.n>=a&&s.n<=b);}
    if($('#orderSel').value==='rand'){
      for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]];}
    }
    pool=list; idx=0; session={done:0,ok:0};
  }

  // ---------- 오디오 (문장 = mp3 전용, TTS 없음) ----------
  function stopAll(){
    if(audio){audio.pause();audio.currentTime=0;}
    if(window.speechSynthesis) speechSynthesis.cancel();
  }
  function playAudio(s){
    stopAll();
    audio=new Audio('audio/'+String(s.n).padStart(3,'0')+'.mp3');
    audio.playbackRate=speed;
    audio.onerror=()=>toast('⚠️ 이 문장은 음성 파일이 없어요 (#'+s.n+')');
    audio.play().catch(()=>{}); // 자동재생 차단 등은 조용히 무시 — 합성음 대체 없음
  }

  // ---------- TTS 목소리 선택 (기본 목소리가 어색하면 여기서 바꿀 수 있음) ----------
  let ttsVoices=[];
  let voiceURI=localStorage.getItem('wfd_voice_uri')||'';
  function scoreVoice(v){
    const n=v.name.toLowerCase();
    let s=0;
    if(n.includes('google')) s+=5;
    if(/natural|neural|online|premium|enhanced/.test(n)) s+=6;
    if(/samantha|ava|zoe|jenny|aria|zira|susan|karen|moira|tessa|female/.test(n)) s+=3;
    if(v.lang==='en-US') s+=2; else if(v.lang.startsWith('en')) s+=1;
    if(/david|fred|albert|bahh|bad news|bells|boing|bubbles|junior|organ|trinoids|whisper|zarvox|hysterical|compact/.test(n)) s-=8;
    return s;
  }
  function bestVoice(){
    if(!ttsVoices.length) return null;
    if(voiceURI){ const v=ttsVoices.find(x=>x.voiceURI===voiceURI); if(v) return v; }
    return ttsVoices.slice().sort((a,b)=>scoreVoice(b)-scoreVoice(a))[0];
  }
  function buildVoiceSel(){
    const sel=document.getElementById('voiceSel'); if(!sel) return;
    if(!ttsVoices.length){ sel.innerHTML='<option>사용 가능한 영어 목소리 없음</option>'; return; }
    const cur=bestVoice();
    sel.innerHTML=ttsVoices.map(v=>`<option value="${v.voiceURI}" ${cur&&v.voiceURI===cur.voiceURI?'selected':''}>${v.name}${v.lang!=='en-US'?' ('+v.lang+')':''}</option>`).join('');
  }
  function refreshVoices(){
    if(!window.speechSynthesis) return;
    ttsVoices=speechSynthesis.getVoices().filter(v=>v.lang && v.lang.toLowerCase().startsWith('en'));
    buildVoiceSel();
  }
  function applyVoice(u){ const v=bestVoice(); if(v) u.voice=v; }
  if(window.speechSynthesis){
    refreshVoices();
    speechSynthesis.onvoiceschanged=refreshVoices;
  }

  // ---------- 단어: 발음(TTS는 단어 전용) + 뜻 + IPA + 저장 ----------
  const sayWord=window.sayWord=function(w){
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(w); u.lang='en-US'; u.rate=0.9; applyVoice(u);
    speechSynthesis.speak(u);
  };
  async function getIPA(word){
    const k=word.toLowerCase();
    if(ipaCache[k]!==undefined) return ipaCache[k];
    try{
      const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(k));
      if(!r.ok) throw 0;
      const j=await r.json();
      let ipa=j[0]&&j[0].phonetic||'';
      if(!ipa&&j[0]&&j[0].phonetics){ const p=j[0].phonetics.find(x=>x.text); ipa=p?p.text:''; }
      ipaCache[k]=ipa||''; save(LSI,ipaCache); return ipa;
    }catch(e){ return ''; }
  }
  const wpop=document.createElement('div'); wpop.id='wpop'; document.body.appendChild(wpop);
  document.addEventListener('click',e=>{ if(!wpop.contains(e.target) && !e.target.classList.contains('wclick')) wpop.style.display='none'; },true);
  function findVocab(word,s){
    const nw=norm(word);
    const cands=[nw,nw.replace(/'s$/,''),nw.replace(/(es|s)$/,''),nw.replace(/(ed|d)$/,''),nw.replace(/ing$/,''),nw.replace(/ies$/,'y')];
    if(s){ for(const v of s.vocab){ const nv=norm(v.w); if(cands.includes(nv)||nv===nw) return v; } }
    // 전체 주차에서 탐색 (단어장 저장용)
    for(const x of sentences()){ for(const v of x.vocab){ const nv=norm(v.w); if(cands.includes(nv)||nv===nw) return v; } }
    return null;
  }
  window.wordInfo=function(ev,word,n){
    ev.stopPropagation();
    const s=n?sentences().find(x=>x.n===n):null;
    const clean=word.replace(/[^A-Za-z'\-]/g,''); if(!clean) return;
    const v=findVocab(clean,s);
    const lk=clean.toLowerCase();
    const already=!!savedWords[lk];
    wpop.innerHTML=`<button class="wx" onclick="document.getElementById('wpop').style.display='none'">✕</button>
      <div class="ww">${clean} <span class="wipa" id="wipa"></span><button class="ws" title="발음">🔊</button></div>
      ${v?`<div class="wm">${v.m}</div><div class="wp">${v.p}</div>`:'<div class="wm" style="color:var(--sub)">단어장에 뜻이 없는 단어예요</div>'}
      <button class="wsave ${already?'saved':''}" id="wsaveBtn">${already?'✓ 내 단어장에 있음':'⭐ 내 단어장에 저장'}</button>`;
    wpop.querySelector('.ws').onclick=e=>{e.stopPropagation();sayWord(clean);};
    $('#wsaveBtn').onclick=e=>{
      e.stopPropagation();
      if(savedWords[lk]){ delete savedWords[lk]; save(LSW,savedWords); e.target.className='wsave'; e.target.textContent='⭐ 내 단어장에 저장'; toast('단어장에서 제거했어요'); }
      else{ savedWords[lk]={w:clean, m:v?v.m:'', p:v?v.p:'', at:Date.now(), r:0, wrong:0}; save(LSW,savedWords); e.target.className='wsave saved'; e.target.textContent='✓ 내 단어장에 있음'; toast('내 단어장에 저장! ('+Object.keys(savedWords).length+'개)'); }
      if(mode==='words') render();
    };
    wpop.style.display='block';
    const pw=wpop.offsetWidth||280, ph=wpop.offsetHeight||120;
    let x=Math.min(ev.clientX,innerWidth-pw-12), y=ev.clientY+14;
    if(y+ph>innerHeight-10) y=ev.clientY-ph-14;
    wpop.style.left=Math.max(8,x)+'px'; wpop.style.top=Math.max(8,y)+'px';
    sayWord(clean);
    getIPA(clean).then(ipa=>{ const el=$('#wipa'); if(el&&ipa) el.textContent=ipa; });
  };
  const wArg=w=>w.replace(/[^A-Za-z'\-]/g,'').replace(/'/g,"&#39;");
  function clickableWords(text,n){
    return text.split(/\s+/).map(w=>`<span class="wclick" onclick="wordInfo(event,'${wArg(w)}',${n})">${w}</span>`).join(' ');
  }

  window.reportIssue=function(n){
    const s=sentences().find(x=>x.n===n); if(!s) return;
    const subject=encodeURIComponent(`[WFD 오류신고] ${week} #${String(n).padStart(3,'0')}`);
    const body=encodeURIComponent(`주차: ${week}\n문항: #${String(n).padStart(3,'0')}\n문장: ${s.en}\n\n오류 내용(음성 끊김/오타/번역 오류 등)을 적어주세요:\n`);
    location.href=`mailto:designer.songji@gmail.com?subject=${subject}&body=${body}`;
  };
  window.playN=function(ev,n){ ev&&ev.stopPropagation(); const s=sentences().find(x=>x.n===n); if(s) playAudio(s); };

  // ---------- 채점 ----------
  function grade(typedRaw,s){
    const ans=s.en.split(/\s+/).filter(Boolean);
    const typed=typedRaw.split(/\s+/).filter(Boolean);
    const A=ans.map(norm), T=typed.map(norm);
    const m=A.length,n=T.length;
    const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
    for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)
      dp[i][j]=A[i]===T[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
    const out=[];let i=0,j=0,okCount=0;
    while(i<m&&j<n){
      if(A[i]===T[j]){out.push({t:ans[i],c:'ok'});okCount++;i++;j++;}
      else if(dp[i+1][j]>=dp[i][j+1]){out.push({t:ans[i],c:'miss'});i++;}
      else{out.push({t:typed[j],c:'extra'});j++;}
    }
    while(i<m){out.push({t:ans[i],c:'miss'});i++;}
    while(j<n){out.push({t:typed[j],c:'extra'});j++;}
    return {out,okCount,total:m,perfect:okCount===m&&T.length===m};
  }
  function record(s,correct){
    const k=keyOf(s);
    const st=stats[k]||{r:0,w:0,streak:0};
    if(correct){st.r++;st.streak++;}else{st.w++;st.streak=0;}
    st.last=Date.now(); stats[k]=st; save(LS,stats);
  }

  // ---------- 공통 UI ----------
  function vocabHtml(s){
    if(!s.vocab.length) return '';
    return '<div class="vocab">'+s.vocab.map(v=>`<span class="vw" title="클릭하면 발음" onclick="event.stopPropagation();sayWord('${wArg(v.w)}')"><b>${v.w}</b> ${v.m} <i>${v.p}</i> 🔊</span>`).join('')+'</div>';
  }
  function audioRow(s){
    return `<div class="audiorow">
      <button class="playbtn" id="btnPlay" title="재생">▶</button>
      <div class="speed">${[0.8,1.0,1.2].map(v=>`<button data-sp="${v}" class="${v===speed?'on':''}">${v}x</button>`).join('')}</div>
    </div>`;
  }
  function navRow(extra){
    return `<div class="btnrow">
      <button class="btn ghost" id="btnPrev" ${idx===0?'disabled style="opacity:.4"':''}>← 이전</button>
      ${extra||''}
      <button class="btn ghost" id="btnSkip">다음 →</button>
    </div>`;
  }
  function wireNav(){
    const p=$('#btnPrev'), sk=$('#btnSkip');
    if(p) p.onclick=()=>goPrev();
    if(sk) sk.onclick=()=>advance();
  }
  function goPrev(){ if(idx>0){ stopAll(); idx--; revealed=false; document.onkeydown=null; render(); } }
  function advance(){ stopAll(); idx++; revealed=false; document.onkeydown=null; render(); }

  function statHtml(){
    const all=sentences(), wrongN=all.filter(isWrongItem).length;
    let seen=0, done=0; all.forEach(s=>{const st=stats[keyOf(s)]; if(st)seen++; if(isDone(s))done++;});
    $('#statBoxes').innerHTML=`
      <div class="box"><div class="v">${all.length}</div><div class="l">이번 주차 문제</div></div>
      <div class="box"><div class="v">${done}</div><div class="l">암기 완료 (2연속 정답)</div></div>
      <div class="box"><div class="v">${wrongN}</div><div class="l">복습 대상</div></div>
      <div class="box"><div class="v">${Object.keys(savedWords).length}</div><div class="l">저장한 단어</div></div>
      <div class="box"><div class="v">${session.done?Math.round(session.ok/session.done*100)+'%':'–'}</div><div class="l">오늘 정답률 (${session.ok}/${session.done})</div></div>`;
  }
  function chip(){
    $('#posChip').innerHTML=pool.length?`<b>${Math.min(idx+1,pool.length)}</b> / ${pool.length}`:'0 / 0';

      // 날짜별 그룹

          <button class="btn primary sm" id="quizAll">전체 시험 시작 →</button>

        ${days.map(day=>{
          const list=byDay[day];
          const label=list[0][1].src?` · ${list[0][1].src}`:'';
          return `<div class="daygroup">
              <h3>📅 ${day}${label}</h3><span class="dcount">${list.length}개</span>

            </div>

              <span class="wi-word" onclick="sayWord('${wArg(info.w||w)}')" title="클릭하면 발음">${info.w||w} 🔊</span>
              <span class="wi-ipa" data-ipa="${w}"></span>
              <span class="wi-mean ${window.__hm?'hidden':''}" onclick="this.classList.remove('hidden')">${info.m||'(뜻 정보 없음)'} ${info.p?`<i style="color:var(--sub);font-size:11px">${info.p}</i>`:''}</span>
              <span class="wi-stat">${info.wrong?`✗${info.wrong}`:''} ${info.r?`✓${info.r}`:''}</span>
              <button class="wi-del" title="삭제" onclick="delWord('${wArg(w)}')">🗑</button>

  // ---------- 단어 시험 ----------
  let quiz={list:[],i:0,day:null,done:0,ok:0,wrongList:[]};
  window.startQuiz=function(day){
    let e=Object.entries(savedWords);
    if(day) e=e.filter(([w,i])=>new Date(i.at).toISOString().slice(0,10)===day);
    if(!e.length){ toast('시험 볼 단어가 없어요'); return; }
    for(let i=e.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[e[i],e[j]]=[e[j],e[i]];}
    quiz={list:e,i:0,day,done:0,ok:0,wrongList:[]};
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.mode==='wordquiz'));
    mode='wordquiz'; render();
  };
  function charDiff(typed,ans){
    const T=typed, A=ans;
    const m=A.length,n=T.length;
    const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
    for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)
      dp[i][j]=A[i].toLowerCase()===T[j].toLowerCase()?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
    const out=[];let i=0,j=0;
    while(i<m&&j<n){
      if(A[i].toLowerCase()===T[j].toLowerCase()){out.push({c:A[i],k:'ok'});i++;j++;}
      else if(dp[i+1][j]>=dp[i][j+1]){out.push({c:A[i],k:'miss'});i++;}
      else{out.push({c:T[j],k:'bad'});j++;}
    }
    while(i<m){out.push({c:A[i],k:'miss'});i++;}
    while(j<n){out.push({c:T[j],k:'bad'});j++;}
    return out;
  }
  function renderQuiz(){
    const stage=$('#stage');
    if(!quiz.list.length){
      stage.innerHTML=`<div class="card empty">단어 시험을 시작하려면 <b>내 단어장</b>에서 "전체 시험 시작" 또는 날짜별 시험을 눌러주세요.<br><br>
        <button class="btn primary" onclick="startQuiz(null)">전체 단어로 바로 시작</button></div>`;
      return;
    }
    if(quiz.i>=quiz.list.length){
      const rate=quiz.done?Math.round(quiz.ok/quiz.done*100):0;
      stage.innerHTML=`<div class="card empty">시험 완료! ${quiz.done}개 중 ${quiz.ok}개 정답 (${rate}%)
        ${quiz.wrongList.length?`<div style="margin-top:14px;font-size:14px">틀린 단어: <b>${quiz.wrongList.join(', ')}</b></div>`:''}
        <div class="btnrow" style="justify-content:center;margin-top:18px">
          ${quiz.wrongList.length?'<button class="btn badb" id="qRetry">틀린 단어만 다시</button>':''}
          <button class="btn primary" id="qAgain">처음부터 다시</button>
        </div></div>`;
      const rt=$('#qRetry'); if(rt) rt.onclick=()=>{
        const set=new Set(quiz.wrongList.map(x=>x.toLowerCase()));
        quiz={list:Object.entries(savedWords).filter(([w])=>set.has(w)),i:0,day:quiz.day,done:0,ok:0,wrongList:[]};
        render();
      };
      $('#qAgain').onclick=()=>startQuiz(quiz.day);
      return;
    }
    const [key,info]=quiz.list[quiz.i];
    const word=info.w||key;
    stage.innerHTML=`<div class="quizcard">
      <div class="qnum" style="justify-content:space-between"><span>${quiz.i+1} / ${quiz.list.length}</span><span>${quiz.day?quiz.day+' 단어':'전체 단어'} 시험</span></div>
      <div class="qmean">${info.m||'(뜻 없음)'}</div>
      <div class="qpos">${info.p||''} · ${word.length}글자</div>
      <div class="audiorow" style="justify-content:center">
        <button class="playbtn" id="qSay" title="발음 듣기">🔊</button>
      </div>
      <input type="text" id="qIn" placeholder="영어 단어를 입력하세요" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div id="qRes"></div>
      <div class="btnrow" style="justify-content:center">
        <button class="btn ghost" id="qPrev" ${quiz.i===0?'disabled style="opacity:.4"':''}>← 이전</button>
        <button class="btn primary" id="qSubmit">확인 (Enter)</button>
        <button class="btn ghost" id="qSkip">모르겠어요</button>
      </div>
    </div>`;
    const inp=$('#qIn'); inp.focus();
    $('#qSay').onclick=()=>sayWord(word);
    sayWord(word);
    const submit=(giveUp)=>{
      if($('#qRes').innerHTML) return;
      const typed=inp.value.trim();
      const correct=!giveUp && typed.toLowerCase()===word.toLowerCase();
      const rec=savedWords[key]||{};
      if(correct){rec.r=(rec.r||0)+1;} else {rec.wrong=(rec.wrong||0)+1; quiz.wrongList.push(word);}
      savedWords[key]=rec; save(LSW,savedWords);
      quiz.done++; if(correct) quiz.ok++;
      const diff=charDiff(typed,word);
      $('#qRes').innerHTML=`<div class="qfeed">${diff.map(d=>`<span class="c-${d.k}">${d.c}</span>`).join('')}</div>
        <div class="qanswer">${correct?'✅ 정답!':'정답: <b>'+word+'</b>'} <span style="margin-left:8px" id="qipa"></span></div>`;
      getIPA(word).then(ipa=>{const el=$('#qipa'); if(el&&ipa) el.textContent=ipa;});
      inp.disabled=true; $('#qSubmit').textContent='다음 (Enter) →';
      $('#qSubmit').onclick=next;
      document.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();document.onkeydown=null;next();} };
    };
    function next(){ document.onkeydown=null; quiz.i++; render(); }
    inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault(); $('#qRes').innerHTML?next():submit(false);} };
    $('#qSubmit').onclick=()=>submit(false);
    $('#qSkip').onclick=()=>submit(true);
    $('#qPrev').onclick=()=>{ if(quiz.i>0){quiz.i--; render();} };
  }
  window.delWord=function(w){ delete savedWords[w.toLowerCase()]; save(LSW,savedWords); toast('삭제했어요'); render(); };

  // ---------- 이벤트 ----------
  let lastWfdMode='wfd';
  const WFD_FAMILY=['wfd','flash','review','browse'];
  function topOf(m){ return WFD_FAMILY.includes(m)?'wfd':m; }
  function syncTabsUI(){
    const top=topOf(mode);

  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return;
    if(e.key==='ArrowLeft') goPrev();
    if(e.key==='ArrowRight') advance();
