<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTE WFD 연습</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#151b2c; --sub:#6b7280; --line:#e5e8ef;
    --accent:#3b5bfd; --accent-soft:#eef1ff; --ok:#0f9d58; --ok-soft:#e6f6ee;
    --bad:#e5484d; --bad-soft:#fdecec; --warn:#b7791f; --warn-soft:#fdf3e0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  header h1{font-size:18px;font-weight:800;letter-spacing:-.3px}
  header h1 span{color:var(--accent)}
  select,button{font-family:inherit;font-size:14px}
  select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .tabs{display:flex;gap:6px;margin-left:auto}
  .tab{padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--sub)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  main{max-width:860px;margin:0 auto;padding:22px 16px 60px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:14px;color:var(--sub)}
  .bar label{display:flex;align-items:center;gap:6px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px}
  .chip b{color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 1px 3px rgba(20,30,60,.05)}
  .qnum{font-size:13px;color:var(--sub);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .audiorow{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  .playbtn{width:54px;height:54px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:22px;cursor:pointer;flex-shrink:0;transition:transform .1s}
  .playbtn:active{transform:scale(.93)}
  .speed{display:flex;gap:4px}
  .speed button{padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12px;color:var(--sub)}
  .speed button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  textarea{width:100%;min-height:92px;padding:14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;resize:vertical;outline:none}
  textarea:focus{border-color:var(--accent)}
  .btnrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .btn{padding:11px 22px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:15px}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn.good{background:var(--ok);color:#fff}
  .btn.badb{background:var(--bad);color:#fff}
  .result{margin-top:20px;padding-top:18px;border-top:1px dashed var(--line)}
  .score{font-size:15px;font-weight:800;margin-bottom:10px}
  .score.allok{color:var(--ok)} .score.miss{color:var(--bad)}
  .diff{line-height:2;font-size:17px}
  .w-ok{color:var(--ok)}
  .w-miss{color:var(--bad);text-decoration:underline;font-weight:700}
  .w-extra{color:var(--warn);text-decoration:line-through}
  .ko{margin-top:12px;color:var(--sub);font-size:15px}
  .vocab{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
  .vw{background:var(--accent-soft);border-radius:8px;padding:6px 10px;font-size:13px}
  .vw b{color:var(--accent)}
  .vw i{color:var(--sub);font-style:normal;font-size:11px}
  .flash{cursor:pointer;user-select:none;min-height:220px;display:flex;flex-direction:column;justify-content:center}
  .flash .en{font-size:22px;font-weight:700;line-height:1.5;letter-spacing:-.2px}
  .flash .hint{margin-top:18px;font-size:13px;color:var(--sub)}
  .empty{text-align:center;color:var(--sub);padding:60px 0;font-size:15px}
  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
  .stat .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
  .stat .box .v{font-size:22px;font-weight:800;color:var(--accent)}
  .stat .box .l{font-size:12px;color:var(--sub);margin-top:2px}
  .prog{height:6px;background:var(--line);border-radius:3px;margin-bottom:18px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
  kbd{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px;font-family:inherit}
  .report{background:none;border:none;color:var(--sub);font-size:12px;cursor:pointer;text-decoration:underline;padding:2px 4px}
  .report:hover{color:var(--bad)}
  .foot{margin-top:14px;font-size:12.5px;color:var(--sub)}
  @media(max-width:600px){ .tabs{margin-left:0;width:100%} .card{padding:18px} }
</style>
</head>
<body>
<header>
  <h1>PTE <span>WFD</span> 연습</h1>
  <select id="weekSel"></select>
  <nav class="tabs">
    <button class="tab on" data-mode="wfd">받아쓰기</button>
    <button class="tab" data-mode="flash">학습카드</button>
    <button class="tab" data-mode="review">오답복습</button>
  </nav>
</header>
<main>
  <div class="stat" id="statBoxes"></div>
  <div class="bar">
    <label>범위 <select id="rangeSel"></select></label>
    <label>순서 <select id="orderSel"><option value="seq">번호순</option><option value="rand">랜덤</option></select></label>
    <label><input type="checkbox" id="autoPlay" checked> 자동재생</label>
    <span class="chip" id="posChip"></span>
  </div>
  <div class="prog"><i id="progBar"></i></div>
  <div id="stage"></div>
  <p class="foot">단축키: <kbd>Enter</kbd> 제출 → 한 번 더 <kbd>Enter</kbd> 다음 문제 · 학습카드는 클릭으로 뒤집기 · 문제 오류는 각 카드의 "오류 신고"로 알려주세요</p>
</main>
<script src="data.js"></script>
<script>
(function(){
  const D = window.WFD_DATA;
  if(!D || !D.weeks){ document.getElementById('stage').innerHTML='<div class="card empty">data.js를 찾을 수 없습니다. index.html과 같은 폴더에 있어야 합니다.</div>'; return; }

  // ---------- 상태 ----------
  const LS='wfd_stats_v2';
  let stats = JSON.parse(localStorage.getItem(LS)||'{}'); // key -> {r,w,streak,last}
  let week = localStorage.getItem('wfd_week') || D.latest;
  if(!D.weeks[week]) week = D.latest;
  let mode='wfd', pool=[], idx=0, revealed=false, audio=null, speed=1.0;
  let session={done:0,ok:0};

  const $=s=>document.querySelector(s);
  const norm=w=>w.toLowerCase().replace(/[^a-z0-9']/g,'');
  const keyOf=s=>{ // 영어문장 기반 키: 주차가 바뀌어도 학습기록 유지
    const t=s.en.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
    let h=0; for(let i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))>>>0;}
    return 'k'+h.toString(36);
  };
  const sentences=()=>D.weeks[week].sentences;
  const isWrongItem=s=>{const st=stats[keyOf(s)]; return st && st.w>0 && st.streak<2;};

  // ---------- 주차/범위 ----------
  function buildWeekSel(){
    const ws=Object.keys(D.weeks).sort().reverse();
    $('#weekSel').innerHTML=ws.map(w=>{
      const t=D.weeks[w].title.match(/\d+년\s*\d+주차/);
      return `<option value="${w}" ${w===week?'selected':''}>${t?t[0]:w} (${D.weeks[w].sentences.length}문제)</option>`;
    }).join('');
  }
  function buildRangeSel(){
    const n=sentences().length, opts=['<option value="all">전체</option>'];
    for(let a=1;a<=n;a+=50) opts.push(`<option value="${a}-${Math.min(a+49,n)}">${a}–${Math.min(a+49,n)}</option>`);
    $('#rangeSel').innerHTML=opts.join('');
  }

  // ---------- 풀 구성 ----------
  function buildPool(){
    let list=sentences().slice();
    if(mode==='review') list=list.filter(isWrongItem);
    const r=$('#rangeSel').value;
    if(r!=='all'){const[a,b]=r.split('-').map(Number); list=list.filter(s=>s.n>=a&&s.n<=b);}
    if($('#orderSel').value==='rand'){
      for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]];}
    }
    pool=list; idx=0; session={done:0,ok:0};
  }

  // ---------- 오디오 ----------
  function playAudio(s){
    if(audio){audio.pause();}
    audio=new Audio('audio/'+String(s.n).padStart(3,'0')+'.mp3');
    audio.playbackRate=speed;
    audio.play().catch(()=>{ // 파일 없으면 브라우저 TTS로 대체
      const u=new SpeechSynthesisUtterance(s.en); u.lang='en-US'; u.rate=speed*0.95;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    });
  }

  // ---------- 채점 (LCS 정렬 diff) ----------
  function grade(typedRaw,s){
    const ans=s.en.split(/\s+/).filter(Boolean);
    const typed=typedRaw.split(/\s+/).filter(Boolean);
    const A=ans.map(norm), T=typed.map(norm);
    const m=A.length,n=T.length;
    const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
    for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)
      dp[i][j]=A[i]===T[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
    const out=[];let i=0,j=0,okCount=0;
    while(i<m&&j<n){
      if(A[i]===T[j]){out.push({t:ans[i],c:'ok'});okCount++;i++;j++;}
      else if(dp[i+1][j]>=dp[i][j+1]){out.push({t:ans[i],c:'miss'});i++;}
      else{out.push({t:typed[j],c:'extra'});j++;}
    }
    while(i<m){out.push({t:ans[i],c:'miss'});i++;}
    while(j<n){out.push({t:typed[j],c:'extra'});j++;}
    return {out,okCount,total:m,perfect:okCount===m&&T.length===m};
  }

  function record(s,correct){
    const k=keyOf(s);
    const st=stats[k]||{r:0,w:0,streak:0};
    if(correct){st.r++;st.streak++;}else{st.w++;st.streak=0;}
    st.last=Date.now(); stats[k]=st;
    localStorage.setItem(LS,JSON.stringify(stats));
  }

  // ---------- 렌더 ----------
  function vocabHtml(s){
    if(!s.vocab.length) return '';
    return '<div class="vocab">'+s.vocab.map(v=>`<span class="vw"><b>${v.w}</b> ${v.m} <i>${v.p}</i></span>`).join('')+'</div>';
  }
  function audioRow(s){
    return `<div class="audiorow">
      <button class="playbtn" id="btnPlay" title="재생">▶</button>
      <div class="speed">${[0.8,1.0,1.2].map(v=>`<button data-sp="${v}" class="${v===speed?'on':''}">${v}x</button>`).join('')}</div>
    </div>`;
  }
  function statHtml(){
    const all=sentences(), wrongN=all.filter(isWrongItem).length;
    let seen=0; all.forEach(s=>{if(stats[keyOf(s)])seen++;});
    $('#statBoxes').innerHTML=`
      <div class="box"><div class="v">${all.length}</div><div class="l">이번 주차 문제</div></div>
      <div class="box"><div class="v">${seen}</div><div class="l">학습한 문장</div></div>
      <div class="box"><div class="v">${wrongN}</div><div class="l">복습 대상</div></div>
      <div class="box"><div class="v">${session.done?Math.round(session.ok/session.done*100)+'%':'–'}</div><div class="l">오늘 정답률 (${session.ok}/${session.done})</div></div>`;
  }
  function chip(){
    $('#posChip').innerHTML=pool.length?`<b>${idx+1}</b> / ${pool.length}`:'0 / 0';
    $('#progBar').style.width=pool.length?(idx/pool.length*100)+'%':'0';
  }

  function render(){
    statHtml(); chip();
    const stage=$('#stage');
    if(!pool.length){
      stage.innerHTML=`<div class="card empty">${mode==='review'?'복습할 오답이 없습니다 🎉<br>받아쓰기에서 틀린 문장이 자동으로 여기에 쌓입니다.':'문제가 없습니다.'}</div>`;
      return;
    }
    if(idx>=pool.length){
      stage.innerHTML=`<div class="card empty">완료! ${session.done}문제 중 ${session.ok}개 정답 (${Math.round(session.ok/session.done*100)||0}%)<br><br><button class="btn primary" id="btnRestart">다시 시작</button></div>`;
      $('#btnRestart').onclick=()=>{buildPool();render();};
      return;
    }
    const s=pool[idx];
    if(mode==='flash'){
      stage.innerHTML=`<div class="card flash" id="flashCard">
        <div class="qnum"><span>#${String(s.n).padStart(3,'0')}</span><span>${revealed?'뒷면':'앞면'} <button class="report" onclick="event.stopPropagation();reportIssue(${s.n})">오류 신고</button></span></div>
        ${audioRow(s)}
        <div class="en">${s.en}</div>
        ${revealed?`<div class="ko">${s.ko}</div>${vocabHtml(s)}`:'<div class="hint">클릭하면 번역과 단어가 보입니다</div>'}
        <div class="btnrow" onclick="event.stopPropagation()">
          <button class="btn good" id="btnKnow">알아요 ✓</button>
          <button class="btn badb" id="btnDont">몰라요 ✗</button>
          <button class="btn ghost" id="btnNext">건너뛰기 →</button>
        </div>
      </div>`;
      $('#flashCard').onclick=()=>{revealed=!revealed;render();};
      $('#btnKnow').onclick=()=>{record(s,true);advance();};
      $('#btnDont').onclick=()=>{record(s,false);advance();};
      $('#btnNext').onclick=()=>advance();
    } else {
      stage.innerHTML=`<div class="card">
        <div class="qnum"><span>#${String(s.n).padStart(3,'0')}</span><span>${mode==='review'?'오답복습':'받아쓰기'} <button class="report" onclick="reportIssue(${s.n})">오류 신고</button></span></div>
        ${audioRow(s)}
        <textarea id="ans" placeholder="들리는 문장을 그대로 입력하세요…" autocomplete="off" spellcheck="false"></textarea>
        <div class="btnrow">
          <button class="btn primary" id="btnSubmit">제출 (Enter)</button>
          <button class="btn ghost" id="btnShow">정답 보기</button>
        </div>
        <div id="resultArea"></div>
      </div>`;
      const ta=$('#ans'); ta.focus();
      ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();}};
      $('#btnSubmit').onclick=submit;
      $('#btnShow').onclick=()=>showResult(grade('',s),s,true);
      function submit(){ if(!$('#resultArea').innerHTML) showResult(grade(ta.value,s),s,false); }
    }
    wireAudio(s);
    if($('#autoPlay').checked) playAudio(s);
  }

  function showResult(g,s,gaveUp){
    const correct=!gaveUp&&g.perfect;
    record(s,correct); session.done++; if(correct)session.ok++;
    const cls=correct?'allok':'miss';
    const label=gaveUp?'정답 공개':(correct?'✓ 만점! '+g.okCount+'/'+g.total:'✗ '+g.okCount+'/'+g.total+' 단어 일치');
    $('#resultArea').innerHTML=`<div class="result">
      <div class="score ${cls}">${label}</div>
      <div class="diff">${g.out.map(w=>`<span class="w-${w.c==='ok'?'ok':w.c==='miss'?'miss':'extra'}">${w.t}</span>`).join(' ')}</div>
      <div class="ko">${s.ko}</div>
      ${vocabHtml(s)}
      <div class="btnrow">
        <button class="btn primary" id="btnNext2">다음 (Enter) →</button>
        <button class="btn ghost" id="btnAgain">다시 듣기</button>
      </div></div>`;
    $('#btnNext2').onclick=()=>advance();
    $('#btnAgain').onclick=()=>playAudio(s);
    document.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.onkeydown=null;advance();}};
    statHtml();
  }

  function advance(){ idx++; revealed=false; document.onkeydown=null; render(); }

  window.reportIssue=function(n){
    const s=sentences().find(x=>x.n===n); if(!s) return;
    const subject=encodeURIComponent(`[WFD 오류신고] ${week} #${String(n).padStart(3,'0')}`);
    const body=encodeURIComponent(
`주차: ${week}
문항: #${String(n).padStart(3,'0')}
문장: ${s.en}

오류 내용(음성 끊김/오타/번역 오류 등)을 적어주세요:
`);
    location.href=`mailto:designer.songji@gmail.com?subject=${subject}&body=${body}`;
  };

  function wireAudio(s){
    const b=$('#btnPlay'); if(b) b.onclick=()=>playAudio(s);
    document.querySelectorAll('[data-sp]').forEach(el=>{
      el.onclick=()=>{speed=parseFloat(el.dataset.sp);
        document.querySelectorAll('[data-sp]').forEach(x=>x.classList.toggle('on',x===el));
        if(audio) audio.playbackRate=speed;};
    });
  }

  // ---------- 이벤트 ----------
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on'); mode=t.dataset.mode; revealed=false; buildPool(); render();
  });
  $('#weekSel').onchange=e=>{week=e.target.value;localStorage.setItem('wfd_week',week);buildRangeSel();buildPool();render();};
  $('#rangeSel').onchange=()=>{buildPool();render();};
  $('#orderSel').onchange=()=>{buildPool();render();};

  buildWeekSel(); buildRangeSel(); buildPool(); render();
})();
</script>
</body>
</html>
