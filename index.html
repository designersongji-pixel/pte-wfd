  // ---------- 전역 검색 ----------
  const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const hl=(text,q)=>{ if(!q) return esc(text);
    const i=text.toLowerCase().indexOf(q.toLowerCase());
    if(i<0) return esc(text);
    return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length)); };
  let sIdx=-1, sHits=[];
  function runSearch(q){
    const box=$('#sResults');
    q=q.trim();
    if(!q){ box.style.display='none'; sHits=[]; return; }
    const ql=q.toLowerCase();
    const all=sentences();
    const sent=[], words=[];
    for(const s of all){
      if(String(s.n)===q||String(s.n).padStart(3,'0')===q){ sent.unshift({s,why:'번호'}); continue; }
      if(s.en.toLowerCase().includes(ql)||s.ko.includes(q)) sent.push({s,why:null});
    }
    const seenW=new Set();
    for(const s of all) for(const v of s.vocab){
      const lw=v.w.toLowerCase();
      if((lw.includes(ql)||v.m.includes(q))&&!seenW.has(lw)){ seenW.add(lw); words.push({v,n:s.n}); }
    }
    sHits=sent.slice(0,40).map(x=>({type:'s',...x}));
    const wHits=words.slice(0,12).map(x=>({type:'w',...x}));
    let html='';
    if(sent.length){
      html+=`<div class="sgroup">문장 ${sent.length}개</div>`;
      html+=sHits.map((h,i)=>`<div class="sitem" data-i="${i}">
        <div class="s-en"><span class="s-n">#${String(h.s.n).padStart(3,'0')}</span>${hl(h.s.en,ql)}</div>
        <div class="s-ko">${hl(h.s.ko,q)}</div></div>`).join('');
    }
    if(words.length){
      html+=`<div class="sgroup">단어 ${words.length}개</div>`;
      html+=wHits.map((h,i)=>`<div class="sitem" data-i="${sHits.length+i}">
        <div class="s-en">${hl(h.v.w,ql)} <span style="color:var(--sub);font-weight:400">${hl(h.v.m,q)}</span> 🔊</div>
        <div class="s-ko">#${String(h.n).padStart(3,'0')} 문장에 등장 · ${h.v.p}</div></div>`).join('');
    }
    sHits=sHits.concat(wHits);
    box.innerHTML=html||'<div class="sempty">검색 결과가 없어요</div>';
    box.style.display='block'; sIdx=-1;
    box.querySelectorAll('.sitem').forEach(el=>el.onclick=()=>pickHit(parseInt(el.dataset.i)));
  }
  function pickHit(i){
    const h=sHits[i]; if(!h) return;
    if(h.type==='w'){ sayWord(h.v.w); toast(`${h.v.w} — ${h.v.m}`); return; }
    jumpTo(h.s.n);
    $('#sResults').style.display='none'; $('#gSearch').value=''; $('#gSearch').blur();
  }
  function jumpTo(n){
    if(mode!=='wfd'&&mode!=='flash'){
      mode='wfd'; lastWfdMode='wfd'; syncTabsUI();
    }
    $('#rangeSel').value='all'; $('#orderSel').value='seq';
    buildPool();
    const at=pool.findIndex(s=>s.n===n);
    idx=at>=0?at:0; revealed=false; lastAutoKey=''; stopAll(); render();
    toast(`#${String(n).padStart(3,'0')} 문장으로 이동했어요`);
  }
  window.jumpTo=jumpTo;
  const gs=$('#gSearch');
  let sTm;
  gs.oninput=()=>{ clearTimeout(sTm); sTm=setTimeout(()=>runSearch(gs.value),180); };
  gs.onfocus=()=>{ if(gs.value.trim()) runSearch(gs.value); };
  gs.onkeydown=e=>{
    const items=[...document.querySelectorAll('#sResults .sitem')];
    if(e.key==='ArrowDown'&&items.length){ e.preventDefault(); sIdx=Math.min(sIdx+1,items.length-1); }
    else if(e.key==='ArrowUp'&&items.length){ e.preventDefault(); sIdx=Math.max(sIdx-1,0); }
    else if(e.key==='Enter'){ e.preventDefault(); pickHit(sIdx>=0?sIdx:0); return; }
    else if(e.key==='Escape'){ gs.value=''; $('#sResults').style.display='none'; gs.blur(); return; }
    else return;
    items.forEach((el,i)=>el.classList.toggle('sel',i===sIdx));
    if(items[sIdx]) items[sIdx].scrollIntoView({block:'nearest'});
  };
  document.addEventListener('click',e=>{ if(!e.target.closest('.searchwrap')) $('#sResults').style.display='none'; });
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); gs.focus(); gs.select(); }
  });

  // ================= PTE 템플릿 / 토픽뱅크 / SWT 체크 =================
  const SPEAKING_ORDER=['di_basic','rl','sgd','rts'];
  function sayText(text){
    if(!window.speechSynthesis){ toast('이 브라우저는 음성 합성을 지원하지 않아요'); return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/\n+/g,'. '));
    u.lang='en-US'; u.rate=0.92; applyVoice(u);
    speechSynthesis.speak(u);
  }
  window.sayText=sayText;

  // ---------- PTE 템플릿 ----------
  let tpl={id:'di_basic', scope:'line', pmode:'trace', idx:0, includeOpt:false};
  const FILLRE=/\(([^)]*)\)|\[([^\]]*)\]|명사/g;
  // 따라치기 모드: (subject)/[word1,word2]/명사 같은 "직접 채워 넣는 부분"을 색으로 표시만 (고정 문구와 구분)
  function markPlaceholders(escapedText){
    return escapedText.replace(FILLRE, m=>'<span class="fillmark">'+m+'</span>');
  }
  // 빈칸채우기 모드: 같은 부분을 실제 타이핑 가능한 입력칸으로 만들어서 직접 채워보게 함
  function clozify(rawText){
    let out='', last=0, m, bi=0;
    FILLRE.lastIndex=0;
    while((m=FILLRE.exec(rawText))){
      out+=esc(rawText.slice(last,m.index));
      const ans=m[0];
      const w=Math.max(3,Math.min(22,[...ans].length));
      out+=`<span class="blankWrap"><input type="text" class="blankInput" data-ans="${esc(ans)}" style="width:${w}ch" spellcheck="false" autocomplete="off" autocapitalize="off"></span>`;
      bi++; last=FILLRE.lastIndex;
    }
    out+=esc(rawText.slice(last));
    return out;
  }
  function tplGradeBlock(target){
    return `<textarea id="tplAns" placeholder="위 문장을 그대로 입력해보세요…" spellcheck="false"></textarea>
      <div class="btnrow"><button class="btn ghost" id="tplPlay">🔊 읽어주기</button><button class="btn primary" id="tplGrade">채점</button></div>
      <div id="tplResult"></div>`;
  }
  function renderTpl(){
    const stage=$('#stage');
    const structs=PTE_TEMPLATES.structures;
    const selHtml=`<select id="tplSel">${PTE_TEMPLATES.order.map(k=>`<option value="${k}" ${k===tpl.id?'selected':''}>${structs[k].title}</option>`).join('')}</select>`;
    const struct=structs[tpl.id];

    if(struct.id==='we'){
      if(weEditing){
        stage.innerHTML=`<div class="structSel">${selHtml}</div>${weEditHtml()}`;
        $('#tplSel').onchange=e=>{tpl.id=e.target.value; weEditing=false; weEditDraft=null; renderTpl();};
        wireWEEdit();
      } else {
        stage.innerHTML=`<div class="structSel">${selHtml}</div>${weHtml()}`;
        $('#tplSel').onchange=e=>{tpl.id=e.target.value; renderTpl();};
        wireWE();
      }
      return;
    }

    const hasOptional=struct.lines.some(l=>l.optional);
    const goal=struct.goalSecLabel || (struct.goalSec+'초');
    const lines=struct.lines.filter(l=>tpl.includeOpt || !l.optional);
    if(tpl.idx>=lines.length) tpl.idx=0;

    let stepbarHtml='';
    if(tpl.scope==='line'){
      stepbarHtml=`<div class="stepbar">`+lines.map((l,i)=>`<div class="step ${i===tpl.idx?'on':''}" data-i="${i}"><span class="si">${l.icon||'▫️'}</span>${l.tag}</div>`).join('')+`</div>`;
    }

    let targetText, sectionLabel='';
    if(tpl.scope==='line'){
      const l=lines[tpl.idx]; targetText=l.text; sectionLabel=l.section||'';
    } else if(tpl.scope==='para'){
      targetText=lines.map(l=>l.text).join('\n');
    } else {
      targetText=SPEAKING_ORDER.map(k=>structs[k].lines.filter(l=>!l.optional).map(l=>l.text).join('\n')).join('\n\n');
    }

    const hasFill=FILLRE.test(targetText); FILLRE.lastIndex=0;
    const legendHtml=hasFill?`<div class="colorLegend"><span class="lg"><span class="sw" style="background:var(--accent-soft);border:1px solid var(--accent)"></span>직접 채워 넣는 부분</span><span class="lg">그 외 = 그대로 외워야 하는 고정 문구</span></div>`:'';
    let bodyHtml='';
    if(tpl.pmode==='trace'){
      bodyHtml=`${sectionLabel?`<div class="sectionhead">${sectionLabel}</div>`:''}
        ${legendHtml}
        <div class="tplTarget">${markPlaceholders(esc(targetText))}</div>
        ${tplGradeBlock(targetText)}`;
    } else if(tpl.pmode==='cloze'){
      bodyHtml=`${sectionLabel?`<div class="sectionhead">${sectionLabel}</div>`:''}
        <div class="tplTarget" id="clozeBox">${clozify(targetText)}</div>
        <div class="btnrow"><button class="btn ghost" id="tplPlay">🔊 읽어주기</button><button class="btn primary" id="tplCheck">채점</button><button class="btn ghost" id="tplFill">정답 채우기</button></div>
        <div id="clozeResult"></div>`;
    } else {
      bodyHtml=`${sectionLabel?`<div class="sectionhead">${sectionLabel}</div>`:''}
        <div class="card" style="background:var(--bg);text-align:center;padding:18px;margin-bottom:14px">안 보고 기억나는 대로 입력해보세요. (${struct.cat})</div>
        ${tplGradeBlock(targetText)}`;
    }

    stage.innerHTML=`
      <div class="structSel">${selHtml}<span class="goalBadge">⏱ 목표 ${goal}</span></div>
      <div class="card">
        <div class="bar" style="margin-bottom:10px">
          <label>범위 <select id="tplScope">
            <option value="line">한 줄</option><option value="para">${struct.cat} 전체</option><option value="all">전체 구조 이어서</option>
          </select></label>
          <label>모드 <select id="tplMode">
            <option value="trace">따라치기</option><option value="cloze">빈칸채우기</option><option value="recall">안보고 암기테스트</option>
          </select></label>
          ${hasOptional?`<label><input type="checkbox" id="tplOpt" ${tpl.includeOpt?'checked':''}> 선택 표현 포함</label>`:''}
        </div>
        ${stepbarHtml}
        ${bodyHtml}
        ${tpl.scope==='line'?`<div class="btnrow"><button class="btn ghost" id="tplPrev" ${tpl.idx===0?'disabled style="opacity:.4"':''}>← 이전</button><span class="chip">${tpl.idx+1} / ${lines.length}</span><button class="btn ghost" id="tplNext" ${tpl.idx>=lines.length-1?'disabled style="opacity:.4"':''}>다음 →</button></div>`:''}
        <div class="tipbox"><b>💡 TIP</b><ul>${struct.tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>
      </div>`;

    $('#tplSel').onchange=e=>{tpl.id=e.target.value; tpl.idx=0; renderTpl();};
    $('#tplScope').value=tpl.scope; $('#tplScope').onchange=e=>{tpl.scope=e.target.value; tpl.idx=0; renderTpl();};
    $('#tplMode').value=tpl.pmode; $('#tplMode').onchange=e=>{tpl.pmode=e.target.value; renderTpl();};
    const optEl=$('#tplOpt'); if(optEl) optEl.onchange=e=>{tpl.includeOpt=e.target.checked; tpl.idx=0; renderTpl();};
    document.querySelectorAll('.step').forEach(el=>el.onclick=()=>{tpl.idx=parseInt(el.dataset.i); renderTpl();});
    const pv=$('#tplPrev'); if(pv) pv.onclick=()=>{tpl.idx--; renderTpl();};
    const nx=$('#tplNext'); if(nx) nx.onclick=()=>{tpl.idx++; renderTpl();};
    const play=$('#tplPlay'); if(play) play.onclick=()=>sayText(targetText);
    const gr=$('#tplGrade'); if(gr) gr.onclick=()=>{
      const g=grade($('#tplAns').value, {en:targetText});
      $('#tplResult').innerHTML=`<div class="result"><div class="score ${g.perfect?'allok':'miss'}">${g.perfect?'✓ 만점! ':'✗ '}${g.okCount}/${g.total} 단어 일치</div><div class="diff">${g.out.map(w=>`<span class="w-${w.c==='ok'?'ok':w.c==='miss'?'miss':'extra'}">${esc(w.t)}</span>`).join(' ')}</div></div>`;
    };
    const chk=$('#tplCheck'); if(chk) chk.onclick=()=>{
      let ok=0, inputs=document.querySelectorAll('#clozeBox .blankInput');
      const norm=v=>v.trim().toLowerCase().replace(/\s+/g,' ');
      inputs.forEach(inp=>{
        const good=inp.value.trim()!=='' && norm(inp.value)===norm(inp.dataset.ans);
        inp.classList.toggle('ok',good);
        inp.classList.toggle('bad',!good && inp.value.trim()!=='');
        if(good) ok++;
      });
      const total=inputs.length;
      $('#clozeResult').innerHTML=`<div class="result"><div class="score ${ok===total?'allok':'miss'}">${ok===total?'✓ 만점! ':'✗ '}${ok}/${total} 빈칸 일치</div></div>`;
    };
    const fl=$('#tplFill'); if(fl) fl.onclick=()=>{
      document.querySelectorAll('#clozeBox .blankInput').forEach(inp=>{ inp.value=inp.dataset.ans; inp.classList.add('ok'); inp.classList.remove('bad'); });
    };
  }

  // ---------- WE (Write Essay) — 2026-08 개편: 카테고리 뱅크 제거 → 5개 자유입력 + SPECIAL SLOT + 템플릿 수정 ----------
  const WE_LSKEY='wfd_we_v2';
  const WE_TPL_LSKEY='wfd_we_template_v1';
  const WE_FIELDS=[
    {key:'topic',label:'TOPIC'},{key:'benefit',label:'BENEFIT'},
    {key:'bexample',label:'BENEFIT EXAMPLE', fallback:'this can help many people in their daily lives'},
    {key:'problem',label:'PROBLEM'},
    {key:'pexample',label:'PROBLEM EXAMPLE', fallback:'this problem can affect many people in different situations'}
  ];
  function weDefaultSentences(){ return PTE_TEMPLATES.structures.we.sentences.map(s=>({n:s.n, section:s.section, text:s.text})); }
  function weLoadTemplate(){
    try{
      const saved=JSON.parse(localStorage.getItem(WE_TPL_LSKEY)||'null');
      if(saved && Array.isArray(saved) && saved.length===PTE_TEMPLATES.structures.we.sentences.length) return saved;
    }catch(e){}
    return weDefaultSentences();
  }
  let weTpl=weLoadTemplate();       // 현재 사용 중인 템플릿(저장된 커스텀 버전 또는 기본값)
  let weEditDraft=null;             // "템플릿 수정" 모드에서만 쓰는 임시 값 (취소하면 버려짐)
  let weEditing=false;
  let weResetArmed=false;

  let weState=Object.assign({
    topic:'', benefit:'', bexample:'', problem:'', pexample:'',
    specialType:'', specialText:'',
    scope:'line', lineIdx:0, wmode:'trace'
  }, JSON.parse(localStorage.getItem(WE_LSKEY)||'{}'));
  function saveWEState(){ save(WE_LSKEY,weState); }

  function weTokenMap(){
    return {
      '[TOPIC]': weState.topic.trim(), '[BENEFIT]': weState.benefit.trim(), '[BENEFIT EXAMPLE]': weState.bexample.trim(),
      '[PROBLEM]': weState.problem.trim(), '[PROBLEM EXAMPLE]': weState.pexample.trim(), '[SPECIAL SLOT]': weState.specialText.trim()
    };
  }
  // 최종 Essay 문장 배열 — SPECIAL SLOT을 안 채웠으면 16번 문장은 통째로 빠짐. 안 채운 나머지 빈칸은 토큰 그대로 남김.
  function weAssembledSentences(){
    const vals=weTokenMap();
    return weTpl.filter(s=> s.section!=='special' || vals['[SPECIAL SLOT]']).map(s=>{
      let t=s.text;
      Object.keys(vals).forEach(tok=>{ if(t.indexOf(tok)>-1) t=t.split(tok).join(vals[tok]||tok); });
      return {n:s.n, section:s.section, text:t};
    });
  }
  function weFullText(){ return weAssembledSentences().map(s=>s.text).join(' '); }
  function weSectionText(key){ return weAssembledSentences().filter(s=>s.section===key).map(s=>s.text).join(' '); }
  function weWordCount(){ const t=weFullText().trim(); return t?t.split(/\s+/).filter(Boolean).length:0; }
  function weWordStatus(wc){
    const we=PTE_TEMPLATES.structures.we;
    if(wc<we.wordRange[0]) return 'short';
    if(wc>we.wordRange[1]) return 'long';
    return 'valid';
  }
  // 문장 하나를 HTML로: 채워진 빈칸=주황(we-var), 안 채운 자리표시자 토큰=파랑 안내(fillmark)
  function weSentHtml(s){
    const vals=weTokenMap();
    let out=esc(s.text);
    Object.keys(vals).forEach(tok=>{
      if(out.indexOf(tok)===-1) return;
      const v=vals[tok];
      const html=v ? '<span class="we-var">'+esc(v)+'</span>' : '<span class="fillmark">'+esc(tok)+'</span>';
      out=out.split(tok).join(html);
    });
    return out;
  }
  function weWcBadgeHtml(){
    const we=PTE_TEMPLATES.structures.we, wc=weWordCount(), status=weWordStatus(wc);
    const label={short:'Too Short',valid:'Valid',long:'Too Long'}[status];
    return `<span class="wcBadge ${status}">Word Count: ${wc} / ${we.wordRange[1]} · ${label}</span><span class="wcRec">권장: ${we.wordRecommended[0]}–${we.wordRecommended[1]} words</span>`;
  }

  function weHtml(){
    const we=PTE_TEMPLATES.structures.we;
    const guideRows=we.specialSlotGuide.map(g=>`<tr><td>${esc(g.label)}</td><td>${g.skip?'<i>'+esc(g.note)+'</i>':esc(g.sentence)+(g.note?'<br><span style="color:var(--sub);font-size:11.5px">'+esc(g.note)+'</span>':'')}</td></tr>`).join('');
    const specialOptions='<option value="">사용 안 함</option>'+we.specialSlotGuide.map(g=>`<option value="${g.key}" ${weState.specialType===g.key?'selected':''}>${esc(g.label)}</option>`).join('');
    return `<div class="card">
      <div class="weTop">
        <h2>PTE Write Essay</h2>
        <span class="weBadge words">${we.wordRange[0]}–${we.wordRange[1]} words</span>
        <span class="weBadge time">⏱ ${we.timeGoalLabel}</span>
        <span class="weTimeDetail">${we.timeGoalDetail}</span>
        <button class="btn ghost sm" id="weEditBtn" style="margin-left:auto">✏️ 템플릿 수정</button>
      </div>
      <div class="wePrincipleBanner">${esc(we.principles[0])}</div>

      <div class="sectionhead">기본적으로 사용자가 바꾸는 5개 빈칸</div>
      <div class="colorLegend"><span class="lg"><span class="sw" style="background:var(--warn-soft);border:1px solid var(--warn)"></span>채워진 빈칸</span><span class="lg"><span class="sw" style="background:var(--accent-soft);border:1px solid var(--accent)"></span>아직 안 채운 자리표시자</span></div>
      <div class="weInputs">
        ${WE_FIELDS.map(f=>`<div class="weField"><label>${f.label}</label><input type="text" id="weIn_${f.key}" value="${esc(weState[f.key])}" placeholder="${f.label} 입력…" autocomplete="off">${f.fallback?`<button type="button" class="btn ghost sm weFallbackBtn" data-key="${f.key}" data-fallback="${esc(f.fallback)}">💡 예시가 안 떠오르면 — 기본 문장 넣기</button>`:''}</div>`).join('')}
      </div>

      <div class="sectionhead">Essay Template (입력하면 실시간 반영)</div>
      <div id="weEssayBox"></div>
      <div class="wordCount" id="weWordCountBox">${weWcBadgeHtml()}</div>
      <div class="btnrow"><button class="btn ghost" id="wePlay">🔊 읽어주기</button></div>

      <div class="sectionhead">✍️ 암기 &amp; 타이핑 연습 — 서론/장점/단점/특별요구사항/결론 + 한 줄씩 + 전체 이어서</div>
      <div class="bar" style="margin-bottom:10px">
        <label>범위 <select id="weScope">
          <option value="line">한 줄 (1~20)</option>
          ${we.sections.map(s=>`<option value="${s.key}">${s.num} ${s.label}</option>`).join('')}
          <option value="all">전체 이어서 (20문장)</option>
        </select></label>
        <label>모드 <select id="weMode">
          <option value="trace">따라치기</option>
          <option value="cloze">빈칸채우기</option>
          <option value="recall">안보고 암기테스트</option>
        </select></label>
      </div>
      <div id="weStage"></div>

      <div class="sectionhead">④ SPECIAL SLOT — 문제에서 요구할 때만 사용</div>
      <div class="weSpecialCtrl"><label>질문 유형 <select id="weSpecialType">${specialOptions}</select></label></div>
      <div id="weSpecialInputWrap"></div>

      <div class="sectionhead">SPECIAL SLOT GUIDE</div>
      <div style="overflow-x:auto"><table class="weGuideTable"><tr><th>문제에서 이런 표현이 나오면</th><th>이 문장을 넣으세요</th></tr>${guideRows}</table></div>

      <div class="tipbox"><b>💡 학습 원칙</b><ul>${we.principles.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>

      <div class="sectionhead">동사원형 (조동사 뒤엔 항상 동사원형)</div>
      <p style="font-size:13px;color:var(--sub);margin-bottom:6px">${we.grammarNote}</p>
      <table class="vtable"><tr><th>동사원형(O)</th><th>잘못된 형태(X)</th><th>의미</th><th>템플릿 예문</th></tr>
        ${we.verbTable.map(v=>`<tr><td><b>${v.base}</b></td><td>${v.wrong}</td><td>${v.mean}</td><td>${v.ex}</td></tr>`).join('')}
      </table>

      <div class="tipbox"><b>💡 문제 풀이 순서</b><ul>${we.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>
    </div>`;
  }
  function renderWEEssay(){
    const we=PTE_TEMPLATES.structures.we;
    const box=$('#weEssayBox'); if(!box) return;
    box.innerHTML=we.sections.map(sec=>{
      const lines=weTpl.filter(s=>s.section===sec.key);
      const isSpecialEmpty=sec.key==='special' && !weState.specialText.trim();
      return `<div class="weSection ${sec.key==='special'?'special':''} ${isSpecialEmpty?'empty':''}">
        <div class="wsTitle">${sec.num} ${esc(sec.label)}${sec.hint?`<span class="wsHint"> — ${esc(sec.hint)}</span>`:''}</div>
        ${lines.map(l=>isSpecialEmpty
          ? `<div class="weSentLine"><span class="wsNum">${l.n}</span><span>[SPECIAL SLOT] (선택사항 — 필요할 때만 입력)</span></div>`
          : `<div class="weSentLine"><span class="wsNum">${l.n}</span><span>${weSentHtml(l)}</span></div>`
        ).join('')}
      </div>`;
    }).join('');
    const wcBox=$('#weWordCountBox'); if(wcBox) wcBox.innerHTML=weWcBadgeHtml();
  }
  function renderWESpecialInput(){
    const we=PTE_TEMPLATES.structures.we;
    const wrap=$('#weSpecialInputWrap'); if(!wrap) return;
    if(!weState.specialType){ wrap.innerHTML=''; return; }
    const g=we.specialSlotGuide.find(x=>x.key===weState.specialType);
    if(g && g.skip){ wrap.innerHTML=`<div class="weSpecialNote">${esc(g.note)}</div>`; return; }
    wrap.innerHTML=`<textarea id="weSpecialText" placeholder="16번 SPECIAL SLOT 문장…" spellcheck="false">${esc(weState.specialText)}</textarea>
      ${g&&g.note?`<div class="weSpecialNote">${esc(g.note)}</div>`:''}`;
    $('#weSpecialText').oninput=e=>{ weState.specialText=e.target.value; saveWEState(); renderWEEssay(); renderWEStage(); };
  }
  function wireWE(){
    WE_FIELDS.forEach(f=>{
      const el=$('#weIn_'+f.key);
      el.oninput=()=>{ weState[f.key]=el.value; saveWEState(); renderWEEssay(); renderWEStage(); };
    });
    document.querySelectorAll('.weFallbackBtn').forEach(btn=>{
      btn.onclick=()=>{
        const key=btn.dataset.key, val=btn.dataset.fallback;
        weState[key]=val;
        const el=$('#weIn_'+key); if(el) el.value=val;
        saveWEState(); renderWEEssay(); renderWEStage();
        toast('기본 예시 문장을 넣었어요 — 필요하면 직접 다듬어도 좋아요');
      };
    });
    $('#weEditBtn').onclick=()=>{ weEditing=true; weEditDraft=null; renderTpl(); };
    $('#wePlay').onclick=()=>sayText(weFullText()||'The essay is still empty.');
    $('#weSpecialType').onchange=e=>{
      weState.specialType=e.target.value;
      const g=PTE_TEMPLATES.structures.we.specialSlotGuide.find(x=>x.key===weState.specialType);
      weState.specialText=(g && !g.skip) ? g.sentence : '';
      saveWEState(); renderWESpecialInput(); renderWEEssay(); renderWEStage();
    };
    $('#weScope').value=weState.scope; $('#weMode').value=weState.wmode;
    $('#weScope').onchange=e=>{weState.scope=e.target.value; saveWEState(); renderWEStage();};
    $('#weMode').onchange=e=>{weState.wmode=e.target.value; saveWEState(); renderWEStage();};
    renderWEEssay();
    renderWESpecialInput();
    renderWEStage();
  }
  // 암기/타이핑 연습 — DI/RL/SGD/RTS와 동일한 패턴(한 줄 스텝바 / 단락별 / 전체 이어서 × 따라치기/빈칸채우기/암기테스트).
  // 원문 템플릿(weTpl)의 문장을 그대로 사용 — [TOPIC] 같은 자리표시자 토큰은 문자 그대로 남겨둠(DI의 (subject)와 동일한 방식).
  function renderWEStage(){
    const box=$('#weStage'); if(!box) return;
    const we=PTE_TEMPLATES.structures.we;
    if(weState.lineIdx==null || weState.lineIdx<0 || weState.lineIdx>=weTpl.length) weState.lineIdx=0;

    let text, sectionLabel='';
    if(weState.scope==='line'){
      const l=weTpl[weState.lineIdx];
      text=l.text;
      const sec=we.sections.find(s=>s.key===l.section);
      sectionLabel=sec?`${sec.num} ${sec.label} · ${l.n}번 문장`:`${l.n}번 문장`;
    } else if(weState.scope==='all'){
      text=weTpl.map(s=>s.text).join('\n');
    } else {
      const sec=we.sections.find(s=>s.key===weState.scope);
      sectionLabel=sec?`${sec.num} ${sec.label}`:'';
      text=weTpl.filter(s=>s.section===weState.scope).map(s=>s.text).join('\n');
    }
    if(!text || !text.trim()){ box.innerHTML='<div class="empty">이 구간에 내용이 없어요.</div>'; return; }

    let stepbarHtml='';
    if(weState.scope==='line'){
      stepbarHtml=`<div class="stepbar">`+weTpl.map((s,i)=>{
        const sec=we.sections.find(x=>x.key===s.section);
        return `<div class="step ${i===weState.lineIdx?'on':''}" data-i="${i}" title="${esc(sec?sec.label:'')}"><span class="si">${sec?sec.num:'▫️'}</span>${s.n}</div>`;
      }).join('')+`</div>`;
    }

    const hasFill=FILLRE.test(text); FILLRE.lastIndex=0;
    const legendHtml=hasFill?`<div class="colorLegend"><span class="lg"><span class="sw" style="background:var(--accent-soft);border:1px solid var(--accent)"></span>직접 채워 넣는 부분</span><span class="lg">그 외 = 그대로 외워야 하는 고정 문구</span></div>`:'';

    let bodyHtml='';
    if(weState.wmode==='trace'){
      bodyHtml=`${sectionLabel?`<div class="sectionhead">${esc(sectionLabel)}</div>`:''}
        ${legendHtml}
        <div class="tplTarget">${markPlaceholders(esc(text))}</div>
        <textarea id="weAns" placeholder="위 문장을 그대로 입력해보세요…" spellcheck="false"></textarea>
        <div class="btnrow"><button class="btn ghost" id="weStagePlay">🔊 읽어주기</button><button class="btn primary" id="weGrade">채점</button></div>
        <div id="weResult"></div>`;
    } else if(weState.wmode==='cloze'){
      bodyHtml=`${sectionLabel?`<div class="sectionhead">${esc(sectionLabel)}</div>`:''}
        <div class="tplTarget" id="weClozeBox">${clozify(text)}</div>
        <div class="btnrow"><button class="btn ghost" id="weStagePlay">🔊 읽어주기</button><button class="btn primary" id="weClozeCheck">채점</button><button class="btn ghost" id="weClozeFill">정답 채우기</button></div>
        <div id="weClozeResult"></div>`;
    } else {
      bodyHtml=`${sectionLabel?`<div class="sectionhead">${esc(sectionLabel)}</div>`:''}
        <div class="card" style="background:var(--bg);text-align:center;padding:18px;margin-bottom:14px">안 보고 기억나는 대로 입력해보세요.</div>
        <textarea id="weAns" placeholder="기억나는 대로 입력…" spellcheck="false"></textarea>
        <div class="btnrow"><button class="btn ghost" id="weStagePlay">🔊 정답 듣기</button><button class="btn primary" id="weGrade">채점</button></div>
        <div id="weResult"></div>`;
    }

    box.innerHTML=`${stepbarHtml}
      ${bodyHtml}
      ${weState.scope==='line'?`<div class="btnrow"><button class="btn ghost" id="weLinePrev" ${weState.lineIdx===0?'disabled style="opacity:.4"':''}>← 이전</button><span class="chip">${weState.lineIdx+1} / ${weTpl.length}</span><button class="btn ghost" id="weLineNext" ${weState.lineIdx>=weTpl.length-1?'disabled style="opacity:.4"':''}>다음 →</button></div>`:''}`;

    document.querySelectorAll('#weStage .step').forEach(el=>el.onclick=()=>{weState.lineIdx=parseInt(el.dataset.i); saveWEState(); renderWEStage();});
    const pv=$('#weLinePrev'); if(pv) pv.onclick=()=>{weState.lineIdx--; saveWEState(); renderWEStage();};
    const nx=$('#weLineNext'); if(nx) nx.onclick=()=>{weState.lineIdx++; saveWEState(); renderWEStage();};

    const play=$('#weStagePlay'); if(play) play.onclick=()=>sayText(text);
    const gr=$('#weGrade'); if(gr) gr.onclick=()=>{
      const g=grade($('#weAns').value, {en:text});
      $('#weResult').innerHTML=`<div class="result"><div class="score ${g.perfect?'allok':'miss'}">${g.perfect?'✓ 만점! ':'✗ '}${g.okCount}/${g.total} 단어 일치</div><div class="diff">${g.out.map(w=>`<span class="w-${w.c==='ok'?'ok':w.c==='miss'?'miss':'extra'}">${esc(w.t)}</span>`).join(' ')}</div></div>`;
    };
    const chk=$('#weClozeCheck'); if(chk) chk.onclick=()=>{
      let ok=0, inputs=document.querySelectorAll('#weClozeBox .blankInput');
      const norm=v=>v.trim().toLowerCase().replace(/\s+/g,' ');
      inputs.forEach(inp=>{
        const good=inp.value.trim()!=='' && norm(inp.value)===norm(inp.dataset.ans);
        inp.classList.toggle('ok',good);
        inp.classList.toggle('bad',!good && inp.value.trim()!=='');
        if(good) ok++;
      });
      const total=inputs.length;
      $('#weClozeResult').innerHTML=`<div class="result"><div class="score ${ok===total?'allok':'miss'}">${ok===total?'✓ 만점! ':'✗ '}${ok}/${total} 빈칸 일치</div></div>`;
    };
    const fl=$('#weClozeFill'); if(fl) fl.onclick=()=>{
      document.querySelectorAll('#weClozeBox .blankInput').forEach(inp=>{ inp.value=inp.dataset.ans; inp.classList.add('ok'); inp.classList.remove('bad'); });
    };
  }

  // ---------- WE 템플릿 수정 모드 ----------
  function weRequiredTokensFor(n){
    const orig=PTE_TEMPLATES.structures.we.sentences.find(s=>s.n===n);
    if(!orig) return [];
    return PTE_TEMPLATES.structures.we.placeholders.filter(tok=>orig.text.indexOf(tok)>-1);
  }
  function weEditHtml(){
    const we=PTE_TEMPLATES.structures.we;
    if(!weEditDraft) weEditDraft=weTpl.map(s=>Object.assign({},s));
    return `<div class="card">
      <div class="weTop"><h2>템플릿 수정</h2></div>
      <p style="font-size:13px;color:var(--sub);margin-bottom:14px">고정 문구는 자유롭게 수정할 수 있어요. 단, <b>[TOPIC]</b> 같은 자리표시자 토큰은 지우면 안 돼요 — 지우면 그 문장에서 실시간 반영·워드카운트가 멈춰요.</p>
      <div class="weEditBar">
        <button class="btn primary" id="weTplSave">Save</button>
        <button class="btn ghost" id="weTplCancel">Cancel</button>
        <button class="btn ghost" id="weTplReset">Reset to Default</button>
      </div>
      ${we.sections.map(sec=>`<div class="weSection ${sec.key==='special'?'special':''}">
        <div class="wsTitle">${sec.num} ${esc(sec.label)}</div>
        ${weEditDraft.filter(s=>s.section===sec.key).map(s=>`<div class="weEditLine"><span class="wsNum">${s.n}</span><input type="text" data-n="${s.n}" class="weEditInput" value="${esc(s.text)}"></div>`).join('')}
      </div>`).join('')}
      <div id="weEditWarn"></div>
    </div>`;
  }
  function wireWEEdit(){
    document.querySelectorAll('.weEditInput').forEach(inp=>{
      inp.oninput=()=>{
        const n=parseInt(inp.dataset.n);
        const req=weRequiredTokensFor(n);
        const ok=req.every(tok=>inp.value.indexOf(tok)>-1);
        inp.classList.toggle('tokenmissing',!ok);
        const line=weEditDraft.find(s=>s.n===n);
        if(line) line.text=inp.value;
      };
    });
    $('#weTplCancel').onclick=()=>{ weEditDraft=null; weEditing=false; renderTpl(); };
    $('#weTplReset').onclick=()=>{
      if(!weResetArmed){ weResetArmed=true; toast('한 번 더 누르면 기본 템플릿으로 초기화돼요'); setTimeout(()=>weResetArmed=false,4000); return; }
      localStorage.removeItem(WE_TPL_LSKEY);
      weTpl=weDefaultSentences(); weEditDraft=null; weEditing=false; weResetArmed=false; renderTpl(); toast('기본 템플릿으로 초기화했어요');
    };
    $('#weTplSave').onclick=()=>{
      const bad=[];
      weEditDraft.forEach(s=>{
        const missing=weRequiredTokensFor(s.n).filter(tok=>s.text.indexOf(tok)===-1);
        if(missing.length) bad.push(s.n+'번: '+missing.join(', ')+' 빠짐');
      });
      if(bad.length){ $('#weEditWarn').innerHTML=`<div class="weTokenWarn">저장 못 했어요 — ${esc(bad.join(' · '))}</div>`; return; }
      weTpl=weEditDraft.map(s=>({n:s.n, section:s.section, text:s.text}));
      localStorage.setItem(WE_TPL_LSKEY, JSON.stringify(weTpl));
      weEditDraft=null; weEditing=false; renderTpl(); toast('템플릿을 저장했어요');
    };
  }

  // ---------- 토픽뱅크 ----------
  const LSBANK='wfd_bank_v1';
  let bankItems=JSON.parse(localStorage.getItem(LSBANK)||'[]');
  let bankFilter={struct:'', q:''};
  function saveBank(){ save(LSBANK,bankItems); }
  function filteredBank(){
    const q=bankFilter.q.toLowerCase();
    return bankItems.filter(it=>(!bankFilter.struct||it.struct===bankFilter.struct) &&
      (!q || it.en.toLowerCase().includes(q) || (it.ko||'').includes(bankFilter.q) || (it.topic||'').toLowerCase().includes(q)));
  }
  function renderBank(){
    const stage=$('#stage');
    const structOpts=['DI','RL','SGD','RTS','SST','WE','기타'];
    stage.innerHTML=`
      <div class="card" style="margin-bottom:16px">
        <div class="sectionhead">새 예문 추가</div>
        <div class="bankform">
          <div class="row2">
            <select id="bkStruct">${structOpts.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
            <input type="text" id="bkType" placeholder="유형 (예: Benefit / Problem / 적용예시)">
            <input type="text" id="bkTopic" placeholder="토픽 (예: online education)">
          </div>
          <textarea id="bkEn" placeholder="영어 문장…" style="min-height:56px"></textarea>
          <textarea id="bkKo" placeholder="한글 뜻 (선택)" style="min-height:40px"></textarea>
          <input type="text" id="bkNote" placeholder="출처/메모 (선택, 예: APEUni #123)">
          <button class="btn primary" id="bkAdd" style="align-self:flex-start">+ 추가</button>
        </div>
      </div>
      <div class="bar">
        <select id="bkFilterStruct"><option value="">전체 구조</option>${structOpts.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
        <input type="text" id="bkSearch" placeholder="검색 (영어/한글/토픽)…" style="flex:1;min-width:180px" value="${esc(bankFilter.q)}">
        <span class="chip" id="bkCount">${filteredBank().length}개</span>
      </div>
      <div id="bkList"></div>`;
    $('#bkFilterStruct').value=bankFilter.struct;
    $('#bkAdd').onclick=()=>{
      const en=$('#bkEn').value.trim(); if(!en){toast('영어 문장을 입력해주세요');return;}
      bankItems.unshift({id:'b'+Date.now()+Math.random().toString(36).slice(2,7), struct:$('#bkStruct').value, type:$('#bkType').value.trim(), topic:$('#bkTopic').value.trim(), en, ko:$('#bkKo').value.trim(), note:$('#bkNote').value.trim(), at:Date.now()});
      saveBank(); toast('토픽뱅크에 추가했어요! ('+bankItems.length+'개)');
      $('#bkType').value='';$('#bkTopic').value='';$('#bkEn').value='';$('#bkKo').value='';$('#bkNote').value='';
      renderBankList();
    };
    $('#bkFilterStruct').onchange=e=>{bankFilter.struct=e.target.value; renderBankList();};
    const si=$('#bkSearch');
    si.oninput=()=>{ bankFilter.q=si.value; clearTimeout(window.__bkt); window.__bkt=setTimeout(renderBankList,200); };
    renderBankList();
  }
  function renderBankList(){
    const list=filteredBank();
    const wrap=$('#bkList'); if(!wrap) return;
    const cnt=$('#bkCount'); if(cnt) cnt.textContent=list.length+'개';
    if(!list.length){ wrap.innerHTML='<div class="card empty">저장된 예문이 없어요. 위에서 추가해보세요.</div>'; return; }
    wrap.innerHTML=list.map(it=>`
      <div class="bankcard" data-id="${it.id}">
        <div class="bc-top">${it.struct?`<span class="tag">${it.struct}</span>`:''}${it.type?`<span class="tag" style="background:var(--ok-soft);color:var(--ok)">${esc(it.type)}</span>`:''}${it.topic?`<span class="tag" style="background:var(--warn-soft);color:var(--warn)">${esc(it.topic)}</span>`:''}</div>
        <div class="bc-en">${clickableWords(it.en,null)}</div>
        ${it.ko?`<div class="bc-ko">${esc(it.ko)}</div>`:''}
        ${it.note?`<div class="bc-note">📎 ${esc(it.note)}</div>`:''}
        <div class="bc-actions">
          <button class="btn ghost sm" data-act="play">🔊 듣기</button>
          <button class="btn ghost sm" data-act="practice">✏️ 연습</button>
          <button class="btn ghost sm" data-act="del">🗑 삭제</button>
        </div>
        <div class="bc-practice" style="display:none;margin-top:10px"></div>
      </div>`).join('');
    wrap.querySelectorAll('.bankcard').forEach(card=>{
      const id=card.dataset.id, it=bankItems.find(x=>x.id===id); if(!it) return;
      card.querySelector('[data-act="play"]').onclick=()=>sayText(it.en);
      card.querySelector('[data-act="del"]').onclick=()=>{ if(confirm('이 예문을 삭제할까요?')){ bankItems=bankItems.filter(x=>x.id!==id); saveBank(); renderBankList(); } };
      card.querySelector('[data-act="practice"]').onclick=()=>{
        const pbox=card.querySelector('.bc-practice');
        const show=pbox.style.display==='none';
        pbox.style.display=show?'block':'none';
        if(show){
          pbox.innerHTML=`<textarea placeholder="안 보고 입력해보세요…" style="min-height:50px" spellcheck="false"></textarea><div class="btnrow"><button class="btn primary sm" data-act="grade">채점</button></div><div class="bc-result"></div>`;
          pbox.querySelector('[data-act="grade"]').onclick=()=>{
            const typed=pbox.querySelector('textarea').value;
            const g=grade(typed,{en:it.en});
            pbox.querySelector('.bc-result').innerHTML=`<div class="diff" style="margin-top:8px">${g.out.map(w=>`<span class="w-${w.c==='ok'?'ok':w.c==='miss'?'miss':'extra'}">${esc(w.t)}</span>`).join(' ')}</div>`;
          };
        }
      };
    });
  }

  // ---------- SWT 체크 ----------
  let swtTimerState={elapsed:0, running:false, _int:null};
  function renderSwtPhaseRow(){
    const S=PTE_TEMPLATES.swt, row=$('#swtPhaseRow'); if(!row) return;
    row.innerHTML=S.phases.map(p=>{
      const cls=swtTimerState.elapsed>=p.to?'past':(swtTimerState.elapsed>=p.from&&swtTimerState.elapsed<p.to?'on':'');
      return `<div class="phasechip ${cls}"><b>${p.label}</b><br>${p.desc}</div>`;
    }).join('');
  }
  function updateSwtClock(){
    const rem=Math.max(0,600-swtTimerState.elapsed), m=Math.floor(rem/60), s=rem%60;
    const el=$('#swtClock'); if(el) el.textContent=`${m}:${String(s).padStart(2,'0')}`;
    renderSwtPhaseRow();
  }
  function renderSWT(){
    const S=PTE_TEMPLATES.swt, stage=$('#stage');
    stage.innerHTML=`
      <div class="card" style="margin-bottom:16px">
        <div class="sectionhead">기준표</div>
        <table class="vtable"><tr><th>지문</th><th>시간</th><th>답변</th><th>단어 수</th><th>채점</th></tr>
          <tr><td>${S.table.passage}</td><td>${S.table.time}</td><td>${S.table.answer}</td><td>${S.table.words}</td><td>${S.table.grading}</td></tr>
        </table>
        <div class="tipbox" style="margin-top:14px"><b>⚠️ FORM 0점 방지</b><ul>${S.formRule.map(r=>`<li>${r}</li>`).join('')}</ul></div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="sectionhead">90초 안에 복사할 문장 찾기</div>
        <div class="checklist">${S.findSteps.map(f=>`<div class="checkitem" style="background:var(--bg)"><b>${f.sec}초</b>&nbsp; ${f.text}</div>`).join('')}</div>
        <div class="sectionhead">문장 선별 O/X 기준</div>
        <div class="critgrid">
          <div class="critcol good"><h4>✅ 고를 문장</h4><ul>${S.good.map(g=>`<li>${g}</li>`).join('')}</ul></div>
          <div class="critcol bad"><h4>❌ 버릴 문장</h4><ul>${S.bad.map(b=>`<li>${b}</li>`).join('')}</ul></div>
        </div>
        <p style="font-size:13px;color:var(--sub);margin-top:12px">${S.selectRule}</p>
        <div class="tipbox"><b>✏️ 최소 수정 규칙</b><ul>${S.minEdit.map(m=>`<li>${m}</li>`).join('')}</ul></div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="sectionhead">⏱ 10분 실전 타이머</div>
        <div class="timerBig" id="swtClock">10:00</div>
        <div class="phaserow" id="swtPhaseRow"></div>
        <div class="btnrow" style="justify-content:center">
          <button class="btn primary" id="swtStart" ${swtTimerState.running?'disabled':''}>시작</button>
          <button class="btn ghost" id="swtPause" ${swtTimerState.running?'':'disabled'}>일시정지</button>
          <button class="btn ghost" id="swtReset">초기화</button>
        </div>
      </div>
      <div class="card">
        <div class="sectionhead">내 초안 자동 검사</div>
        <textarea id="swtDraft" placeholder="작성한 요약 문장을 붙여넣으세요…" style="min-height:90px"></textarea>
        <div class="btnrow"><button class="btn primary" id="swtCheck">검사</button></div>
        <div id="swtCheckResult"></div>
        <div class="tipbox" style="margin-top:14px"><b>✅ 최종 체크리스트</b><ul>${S.finalChecklist.map(c=>`<li>${c}</li>`).join('')}</ul></div>
      </div>`;
    updateSwtClock();
    $('#swtStart').onclick=()=>{
      if(swtTimerState.running) return;
      swtTimerState.running=true; $('#swtStart').disabled=true; $('#swtPause').disabled=false;
      swtTimerState._int=setInterval(()=>{
        swtTimerState.elapsed++; updateSwtClock();
        if(swtTimerState.elapsed>=600){ clearInterval(swtTimerState._int); swtTimerState.running=false; toast('⏰ 10분 종료!'); }
      },1000);
    };
    $('#swtPause').onclick=()=>{ clearInterval(swtTimerState._int); swtTimerState.running=false; $('#swtStart').disabled=false; $('#swtPause').disabled=true; };
    $('#swtReset').onclick=()=>{ clearInterval(swtTimerState._int); swtTimerState={elapsed:0,running:false,_int:null}; $('#swtStart').disabled=false; $('#swtPause').disabled=true; updateSwtClock(); };
    $('#swtCheck').onclick=()=>{
      const t=$('#swtDraft').value.trim();
      const words=t.split(/\s+/).filter(Boolean).length;
      const periods=(t.match(/\./g)||[]).length;
      const endsWithPeriod=/\.\s*$/.test(t);
      const midPeriod=/\.\s*\S/.test(t.replace(/\.\s*$/,''));
      const startsUpper=/^[A-Z]/.test(t);
      const oneSentence=periods===1 && endsWithPeriod;
      const items=[
        {label:'문장이 하나 (마침표 1개, 맨 끝에만)', pass:oneSentence},
        {label:`35-55 단어 (현재 ${words}단어, 공식 허용 5-75)`, pass:words>=35&&words<=55},
        {label:'첫 글자 대문자', pass:startsUpper},
        {label:'중간에 마침표 없음', pass:!midPeriod}
      ];
      $('#swtCheckResult').innerHTML=`<div class="checklist">${items.map(it=>`<div class="checkitem ${it.pass?'pass':'fail'}">${it.pass?'✅':'❌'} ${it.label}</div>`).join('')}</div>`;
    };
  }

  buildWeekSel(); buildRangeSel(); renderPlan(); buildPool(); render(); syncTabsUI();
})();
</script>
</body>
</html>
